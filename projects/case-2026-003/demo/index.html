<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>又见人尔 · 门店预约小程序 · 交互预览</title>
<style>
:root{
  --app:#F5F2EC; --card:#fff;
  --ink:#2E4A41; --ink-deep:#1F3630; --ink-soft:#E7EFEA;
  --gold:#B08D57; --gold-soft:#F5EEE1;
  --tx:#1E2422; --tx2:#5C6862; --tx3:#98A29C;
  --line:#E8E2D8; --line-soft:#F2EEE7;
  --shadow:0 6px 22px rgba(31,54,48,.06);
  --shadow2:0 14px 40px rgba(31,54,48,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 620px at 10% -10%, #FCF9F4 0%, transparent 58%),
    radial-gradient(900px 520px at 100% 0%, #E6EFE9 0%, transparent 55%),
    linear-gradient(160deg,#F0EBE2 0%, #E6DFD3 100%);
  color:var(--tx);min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.shell{display:flex;gap:38px;padding:40px 44px 60px;max-width:1440px;margin:0 auto;align-items:flex-start}

/* ================= 左侧 ================= */
.side{width:300px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:14px}
.brand img{width:52px;height:52px;border-radius:50%;box-shadow:var(--shadow)}
.brand-en{font-size:10px;letter-spacing:.34em;color:var(--tx3)}
.brand-name{font-size:22px;font-weight:700;letter-spacing:.1em;line-height:1.2;margin-top:3px}
.side-sub{font-size:12.5px;color:var(--tx2);line-height:1.9;margin-top:20px}
.side-sub b{color:var(--ink);font-weight:600}

.nav{margin-top:24px;background:#fff;border-radius:22px;padding:8px;box-shadow:var(--shadow)}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:16px;cursor:pointer;transition:.18s;border:1.5px solid transparent}
.nav-item:hover{background:#F9F7F3}
.nav-item.on{background:var(--ink-soft);border-color:var(--ink)}
.nav-ico{width:32px;height:32px;border-radius:10px;background:#F4F1EC;display:flex;align-items:center;justify-content:center;color:var(--tx2);flex-shrink:0}
.nav-item.on .nav-ico{background:var(--ink);color:#fff}
.nav-txt{flex:1;min-width:0}
.nav-t{font-size:13px;font-weight:600}
.nav-d{font-size:10.5px;color:var(--tx3);margin-top:2px}
.nav-arrow{width:6px;height:6px;border-top:1.5px solid var(--tx3);border-right:1.5px solid var(--tx3);transform:rotate(45deg);flex-shrink:0}

.palette{margin-top:26px}
.palette-t{font-size:10.5px;letter-spacing:.22em;color:var(--tx3);margin-bottom:11px}
.swatches{display:flex;gap:8px}
.sw{flex:1;height:48px;border-radius:12px;position:relative;box-shadow:var(--shadow)}
.sw span{position:absolute;left:8px;bottom:6px;font-size:8.5px;letter-spacing:.02em;color:rgba(255,255,255,.92)}
.sw span.dark{color:rgba(30,36,34,.5)}

.tips{margin-top:26px;background:#fff;border-radius:20px;padding:18px 20px;box-shadow:var(--shadow)}
.tips-t{font-size:11px;letter-spacing:.2em;color:var(--tx3);margin-bottom:12px}
.tip{display:flex;gap:9px;font-size:11.5px;color:var(--tx2);line-height:1.75;margin-bottom:9px}
.tip:last-child{margin-bottom:0}
.tip i{width:5px;height:5px;border-radius:50%;background:var(--gold);flex-shrink:0;margin-top:7px}

/* ================= 手机 ================= */
.stage{flex:1;display:flex;justify-content:center;padding-top:4px}
.device{
  width:392px;height:812px;flex-shrink:0;
  background:linear-gradient(150deg,#3B4245,#1B2123 42%,#2C3437);
  border-radius:56px;padding:11px;position:relative;
  box-shadow:0 44px 84px -22px rgba(20,30,27,.45), 0 0 0 2px rgba(255,255,255,.14) inset, 0 0 100px rgba(176,141,87,.15);
}
.device::after{content:"";position:absolute;left:8px;top:176px;width:3px;height:72px;border-radius:3px;background:linear-gradient(#4A5255,#252B2E)}
.device::before{content:"";position:absolute;right:8px;top:206px;width:3px;height:98px;border-radius:3px;background:linear-gradient(#4A5255,#252B2E)}
.screen{width:100%;height:100%;background:var(--app);border-radius:46px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.island{position:absolute;top:13px;left:50%;transform:translateX(-50%);width:104px;height:26px;border-radius:16px;background:#0B0F10;z-index:120}
.sbar{position:absolute;left:0;right:0;top:0;height:46px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 24px 5px;font-size:12px;font-weight:600;color:#fff;z-index:110}
.sbar.dark{color:#1E2422}
.sbar-r{display:flex;align-items:center;gap:4px}
.sbar-r i{display:block;background:currentColor;border-radius:1px}
.bar-cov i:nth-child(1){width:15px;height:9px;border-radius:2px;opacity:.95}
.bar-cov i:nth-child(2){width:2px;height:11px;margin-left:1px}
.bar-cov i:nth-child(3){width:2.5px;height:9px;margin-left:1px}
.view{flex:1;overflow-y:auto;overflow-x:hidden;padding-top:46px;scrollbar-width:none;background:var(--app)}
.view::-webkit-scrollbar{display:none}
.page{padding-bottom:26px;animation:pin .34s cubic-bezier(.22,.68,.32,1) both}
@keyframes pin{from{opacity:0}to{opacity:1}}
.page>*{animation:rise .42s cubic-bezier(.22,.68,.32,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fbarhost{position:absolute;left:0;right:0;bottom:0;z-index:70;pointer-events:none}
.fbarhost>*{pointer-events:auto}
.immersive{margin-top:-46px}
#layer{position:absolute;left:0;top:0;right:0;bottom:0;z-index:80;pointer-events:none}
#layer>*{pointer-events:auto}

.tabbar{flex-shrink:0;height:66px;background:rgba(255,255,255,.97);backdrop-filter:blur(18px);border-top:1px solid var(--line-soft);display:flex;padding-bottom:12px}
.tabbar.hide{display:none}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:#A6AEA9;transition:.15s}
.tab span{font-size:9.5px;letter-spacing:.04em}
.tab.on{color:var(--ink)}
.tab.on span{font-weight:600}

/* ================= 组件 ================= */
.wrap{padding:0 14px}
.card{background:#fff;border-radius:14px;box-shadow:var(--shadow)}
.pad{padding:15px}
.sec{margin-top:23px}
.shead{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:11px;padding:0 14px}
.shead.fl{padding:0}
.stitle{font-size:17px;font-weight:600;letter-spacing:.02em;display:flex;align-items:center}
.stitle::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--gold);margin-right:7px}
.ssub{font-size:11px;color:var(--tx3);margin-top:4px}
.smore{font-size:11.5px;color:var(--tx3);display:flex;align-items:center;gap:4px;cursor:pointer}
.arw{width:5px;height:5px;border-top:1.5px solid currentColor;border-right:1.5px solid currentColor;transform:rotate(45deg)}
.tag{display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:9px;font-size:9.5px;letter-spacing:.04em;flex-shrink:0}
.tag.gold{color:var(--gold);background:var(--gold-soft)}
.tag.soft{color:var(--tx2);background:var(--line-soft)}
.tag.line{color:var(--ink);border:1px solid var(--ink-soft)}
.price{display:flex;align-items:baseline;color:var(--ink);font-weight:600}
.price .c{font-size:11px;margin-right:1px}
.price .n{font-size:19px;letter-spacing:-.02em}
.price .o{font-size:10.5px;color:var(--tx3);text-decoration:line-through;margin-left:6px;font-weight:400}
.btn{display:flex;align-items:center;justify-content:center;height:46px;border-radius:23px;font-size:15px;font-weight:600;letter-spacing:.06em;cursor:pointer;transition:.15s}
.btn.pri{background:var(--ink);color:#fff}
.btn.pri:hover{background:var(--ink-deep)}
.btn.pri.off{background:#D8D9D4}
.btn.gho{background:var(--ink-soft);color:var(--ink-deep)}
.btn.out{border:1px solid var(--line);color:var(--tx2);font-weight:500;background:#fff}
.btn.sm{height:33px;padding:0 15px;font-size:12.5px;letter-spacing:.02em;border-radius:17px}
.dot-sep{margin:0 5px;color:var(--tx3)}
.hscroll{display:flex;gap:11px;overflow-x:auto;padding:3px 14px 12px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}

/* ================= 首页 ================= */
.hero{position:relative;height:322px;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .mk{position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,28,25,.5) 0%,rgba(18,28,25,.16) 34%,rgba(18,28,25,.48) 70%,rgba(18,28,25,.8) 100%)}
.hero .top{position:absolute;left:20px;top:58px;z-index:2}
.b-en{font-size:9.5px;letter-spacing:.34em;color:rgba(255,255,255,.82);text-shadow:0 1px 10px rgba(0,0,0,.4)}
.b-nm{font-size:22px;font-weight:700;letter-spacing:.1em;color:#fff;margin-top:6px;text-shadow:0 2px 16px rgba(0,0,0,.25)}
.hero .bot{position:absolute;left:20px;right:20px;bottom:50px;z-index:2}
.h-slo{font-size:12px;color:rgba(255,255,255,.94);letter-spacing:.02em;text-shadow:0 1px 10px rgba(0,0,0,.45)}
.h-stats{display:flex;align-items:center;margin-top:13px}
.hs{display:flex;flex-direction:column}
.hs b{font-size:17px;color:#fff;font-weight:600;line-height:1.1;text-shadow:0 1px 12px rgba(0,0,0,.5)}
.hs span{font-size:9.5px;color:rgba(255,255,255,.84);margin-top:4px;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.hs-sp{width:1px;height:17px;background:rgba(255,255,255,.3);margin:0 16px}
.body-up{position:relative;margin-top:-28px;border-radius:22px 22px 0 0;background:var(--app);padding-top:15px}

.loginbar{display:flex;align-items:center;background:#fff;border-radius:14px;padding:12px 13px;box-shadow:var(--shadow);cursor:pointer}
.loginbar img{width:38px;height:38px;border-radius:50%;margin-right:11px;background:var(--ink-soft)}
.lb-t{font-size:13.5px;font-weight:600}
.lb-s{font-size:10.5px;color:var(--tx3);margin-top:3px}
.lb-b{height:31px;padding:0 14px;border-radius:16px;background:var(--ink);color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;flex-shrink:0}

.quick{display:flex;padding:16px 0 14px;margin-top:12px}
.qi{flex:1;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.qi .box{width:44px;height:44px;border-radius:14px;background:var(--ink-soft);color:var(--ink);display:flex;align-items:center;justify-content:center;transition:.18s}
.qi:hover .box{transform:translateY(-2px)}
.qi span{font-size:11.5px;color:var(--tx2);margin-top:8px}

.hot{width:202px;flex-shrink:0;background:#fff;border-radius:15px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:.18s}
.hot:hover{transform:translateY(-2px);box-shadow:var(--shadow2)}
.hot .md{position:relative;height:124px}
.hot .md img{width:100%;height:100%;object-fit:cover;display:block}
.hot .md .fl{position:absolute;left:9px;top:9px;height:20px;padding:0 9px;border-radius:10px;background:rgba(31,54,48,.86);color:#fff;font-size:9.5px;letter-spacing:.1em;display:flex;align-items:center;backdrop-filter:blur(8px)}
.hot .bd{padding:12px}
.hot .nm{font-size:14.5px;font-weight:600}
.hot .sb{font-size:10.5px;color:var(--tx3);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hot .ft{display:flex;align-items:flex-end;justify-content:space-between;margin-top:11px}
.hot .mt{font-size:10.5px;color:var(--tx3)}

.promise{display:flex;align-items:flex-start;padding:11px 0}
.promise:first-child{padding-top:2px}
.promise+.promise{border-top:1px solid var(--line-soft)}
.pr-ico{width:34px;height:34px;border-radius:11px;background:var(--gold-soft);color:var(--gold);display:flex;align-items:center;justify-content:center;margin-right:11px;flex-shrink:0}
.pr-t{font-size:13.5px;font-weight:600}
.pr-d{font-size:11px;color:var(--tx3);margin-top:3px;line-height:1.6}

.env{width:200px;flex-shrink:0}
.env img{width:100%;height:141px;border-radius:13px;object-fit:cover;display:block;background:#E9E3D9}
.env .nm{font-size:13px;font-weight:600;margin-top:9px}
.env .ds{font-size:10.5px;color:var(--tx3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.th{width:160px;flex-shrink:0;background:#fff;border-radius:15px;padding:17px 12px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center}
.th img.av{width:66px;height:66px;border-radius:50%;object-fit:cover;background:#E9E3D9}
.th .nm{font-size:14px;font-weight:600;margin-top:10px;letter-spacing:.04em}
.th .ti{font-size:10.5px;color:var(--tx3);margin-top:4px}
.th .rt{display:flex;align-items:center;gap:3px;font-size:10.5px;color:var(--gold);margin-top:7px}
.th .tgs{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:8px}
.th .tgs .tag{background:var(--app)}

.review{margin-bottom:10px}
.rv-h{display:flex;align-items:center}
.rv-u{font-size:12.5px;font-weight:600}
.rv-s{margin-left:8px;display:flex;gap:2px}
.rv-d{margin-left:auto;font-size:10px;color:var(--tx3)}
.rv-c{font-size:12.5px;color:var(--tx2);line-height:1.75;margin-top:9px}
.rv-f{font-size:10.5px;color:var(--tx3);margin-top:9px}

.info .row{display:flex;align-items:center;padding:14px 15px;cursor:pointer}
.info .row+.row{border-top:1px solid var(--line-soft)}
.info .ico{color:var(--tx2);margin-right:11px;flex-shrink:0;display:flex}
.info .lab{font-size:10.5px;color:var(--tx3);letter-spacing:.05em}
.info .val{font-size:13px;margin-top:4px;line-height:1.5}
.iact{display:flex;gap:10px;margin-top:12px}
.iact .btn{flex:1}

.foot{padding:34px 30px 26px;text-align:center}
.foot img{width:38px;height:38px;opacity:.85}
.foot .nm{font-size:11.5px;color:var(--tx2);letter-spacing:.1em;margin-top:11px}
.foot .ds{font-size:10.5px;color:var(--tx3);line-height:1.8;margin-top:7px}

/* ================= 服务 ================= */
.search{display:flex;align-items:center;height:44px;background:#fff;border-radius:22px;padding:0 15px;box-shadow:var(--shadow);margin-top:12px}
.search .sic{color:var(--tx3);margin-right:9px;display:flex}
.search input{flex:1;border:0;outline:0;font-size:13px;background:transparent;color:var(--tx);font-family:inherit;min-width:0}
.search input::placeholder{color:#B7BDB8}
.search .clr{font-size:11.5px;color:var(--tx3);cursor:pointer;flex-shrink:0}

.cats{display:flex;gap:8px;overflow-x:auto;padding:14px 14px 4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{height:34px;padding:0 15px;border-radius:17px;background:#fff;color:var(--tx2);font-size:12.5px;display:flex;align-items:center;white-space:nowrap;box-shadow:var(--shadow);cursor:pointer;transition:.18s;flex-shrink:0}
.cat.on{background:var(--ink);color:#fff;font-weight:600;box-shadow:0 8px 18px rgba(46,74,65,.24)}
.cbar{display:flex;align-items:center;justify-content:space-between;margin:17px 2px 10px}
.cbar .t{font-size:11.5px;color:var(--tx3)}

.svc{display:flex;background:#fff;border-radius:14px;padding:12px;margin-bottom:11px;box-shadow:var(--shadow);cursor:pointer;transition:.16s}
.svc:hover{transform:translateY(-2px);box-shadow:var(--shadow2)}
.svc .im{width:108px;height:108px;border-radius:12px;object-fit:cover;margin-right:12px;flex-shrink:0;background:#E9E3D9}
.svc .bd{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;padding:2px 0}
.svc .nm{font-size:15px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.svc .sb{font-size:11px;color:var(--tx3);margin-top:5px}
.svc .mta{display:flex;align-items:center;font-size:10.5px;color:var(--tx3);margin-top:7px}
.svc .ft{display:flex;align-items:flex-end;justify-content:space-between;margin-top:8px}
.ths{display:flex;flex-direction:row-reverse}
.ths img{width:22px;height:22px;border-radius:50%;border:1px solid #fff;margin-left:-7px;object-fit:cover;background:#E9E3D9}

.empty{text-align:center;padding:56px 20px 40px}
.empty img{width:56px;height:56px;opacity:.3}
.empty .t{font-size:14px;color:var(--tx2);font-weight:500;margin-top:14px}
.empty .d{font-size:11.5px;color:var(--tx3);margin-top:7px;line-height:1.7}
.empty .btn{display:inline-flex;margin-top:18px}

/* ================= 详情 ================= */
.dhero{position:relative;height:294px;overflow:hidden}
.dhero img{width:100%;height:100%;object-fit:cover;display:block}
.dhero .mk{position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,28,25,.42) 0%,rgba(18,28,25,.05) 40%,rgba(18,28,25,.66) 100%)}
.navbar{position:absolute;left:15px;top:56px;z-index:3;display:flex;gap:9px}
.nb-btn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.22);backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer}
.bk{width:9px;height:9px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(45deg);margin-left:3px}
.dhero .txt{position:absolute;left:20px;right:20px;bottom:48px;z-index:2}
.dhero .tgs{display:flex;gap:6px;margin-bottom:10px}
.dhero .nm{font-size:24px;font-weight:700;color:#fff;letter-spacing:.05em;text-shadow:0 2px 18px rgba(0,0,0,.3)}
.dhero .sb{font-size:12px;color:rgba(255,255,255,.92);margin-top:8px;text-shadow:0 1px 10px rgba(0,0,0,.4)}

.pc-row{display:flex;align-items:center;justify-content:space-between}
.pc-bd{height:24px;padding:0 10px;border-radius:12px;background:var(--gold-soft);color:var(--gold);font-size:10.5px;letter-spacing:.05em;display:flex;align-items:center}
.pc-bd.plain{background:var(--ink-soft);color:var(--ink)}
.hr{height:1px;background:var(--line-soft);margin:13px 0 12px}
.pc-meta{display:flex;align-items:center}
.pc-i{flex:1;display:flex;flex-direction:column;align-items:center}
.pc-i b{font-size:16px;color:var(--ink);font-weight:600;line-height:1.1}
.pc-i span{font-size:10px;color:var(--tx3);margin-top:5px}
.pc-sp{width:1px;height:22px;background:var(--line-soft)}

.effs{display:flex;flex-wrap:wrap;gap:8px}
.eff{display:flex;align-items:center;height:37px;padding:0 13px;background:#fff;border-radius:19px;box-shadow:var(--shadow);font-size:12.5px;color:var(--gold)}
.eff span{color:var(--tx);margin-left:6px}

.para{font-size:13px;color:var(--tx2);line-height:1.8}
.kv{display:flex;align-items:flex-start}
.kv .lab{font-size:11px;color:var(--ink);background:var(--ink-soft);border-radius:4px;padding:3px 7px;margin-right:9px;flex-shrink:0;letter-spacing:.05em}
.kv .val{font-size:12.5px;color:var(--tx2);line-height:1.7;flex:1}

.step{display:flex;align-items:flex-start}
.step .lf{display:flex;flex-direction:column;align-items:center;margin-right:12px;flex-shrink:0}
.step .dt{width:28px;height:28px;border-radius:50%;background:var(--ink-soft);color:var(--ink);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;letter-spacing:.05em}
.step .ln{width:1px;flex:1;min-height:17px;background:var(--line);margin:3px 0}
.step .bd{padding:6px 0 13px;font-size:13.5px}
.step-tip{font-size:10.5px;color:var(--tx3);line-height:1.7;margin-top:4px;padding-left:40px}

.thr{display:flex;align-items:center;background:#fff;border-radius:14px;padding:13px;margin-bottom:10px;box-shadow:var(--shadow)}
.thr img{width:52px;height:52px;border-radius:50%;object-fit:cover;margin-right:12px;flex-shrink:0;background:#E9E3D9}
.thr .nm{font-size:14.5px;font-weight:600}
.thr .ti{font-size:10.5px;color:var(--tx3);margin-left:7px}
.thr .gd{font-size:11px;color:var(--gold);margin-top:5px}
.thr .mt{display:flex;align-items:center;font-size:10px;color:var(--tx3);margin-top:5px}
.thr .go{height:28px;padding:0 12px;border-radius:14px;border:1px solid var(--ink-soft);color:var(--ink);font-size:11.5px;display:flex;align-items:center;flex-shrink:0;cursor:pointer;letter-spacing:.05em}

/* ================= 工具 ================= */
const pad=n=>n<10?'0'+n:''+n
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())
const today=()=>dstr(new Date())
const shift=n=>{const t=new Date();return dstr(new Date(t.getFullYear(),t.getMonth(),t.getDate()+n))}
const parse=s=>{const p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
const WD='日一二三四五六'
const weekday=s=>WD[parse(s).getDay()]
const monthDay=s=>{const p=s.split('-');return (+p[1])+'月'+(+p[2])+'日'}
const slotMin=s=>{const p=s.split(':');return (+p[0])*60+(+p[1])}
function isPast(date,slot){
  const t=today()
  if(date>t) return false
  if(date<t) return true
  const n=new Date()
  return slotMin(slot)<=n.getHours()*60+n.getMinutes()+60
}
const stamp=(d,s)=>d+' '+s
const orderNo=()=>'YR'+today().replace(/-/g,'')+'-'+Math.floor(1000+Math.random()*9000)

/* ================= 数据层 ================= */
const svc=id=>SERVICES.find(s=>s.id===id)
const thsOf=id=>{const s=svc(id);return s?s.therapistIds.map(t=>THERAPISTS.find(x=>x.id===t)):[]}
function busySlots(date,tid){
  const rec=[]
  BUSY.forEach(b=>{if(shift(b.d)===date)rec.push({s:b.s,t:b.t})})
  RECORDS.forEach(r=>{if(r.date===date&&r.status!=='canceled')rec.push({s:r.slot,t:r.therapistId||''})})
  if(tid) return [...new Set(rec.filter(x=>x.t===tid||x.t==='').map(x=>x.s))]
  const c={}
  rec.forEach(x=>{if(x.t)c[x.s]=(c[x.s]||0)+1})
  return Object.keys(c).filter(k=>c[k]>=THERAPISTS.length)
}
function slotState(date,slot,tid){
  if(isPast(date,slot)) return 'past'
  return busySlots(date,tid).indexOf(slot)>-1?'busy':'free'
}
const freeCount=(date,tid)=>SLOTS.filter(s=>slotState(date,s,tid)==='free').length
function nowStamp(){const n=new Date();return today()+' '+pad(n.getHours())+':'+pad(n.getMinutes())}
function decorate(r){
  const st=r.status==='canceled'?'canceled':(stamp(r.date,r.slot)<nowStamp()?'done':'pending')
  return Object.assign({},r,{status:st,
    statusText:{pending:'待服务',done:'已完成',canceled:'已取消'}[st],
    statusClass:'st-'+st,monthDay:monthDay(r.date),weekday:weekday(r.date),canCancel:st==='pending'})
}
const allRecords=()=>RECORDS.map(decorate).sort((a,b)=>stamp(a.date,a.slot)<stamp(b.date,b.slot)?1:-1)
function countByStatus(){
  const c={all:0,pending:0,done:0,canceled:0}
  allRecords().forEach(r=>{c.all++;c[r.status]++})
  return c
}
function userStats(){
  const all=allRecords(),done=all.filter(r=>r.status==='done')
  const spend=done.reduce((s,r)=>s+r.price,0)
  const LV=[{n:'新客会员',min:0,next:500},{n:'银卡会员',min:500,next:1500},{n:'金卡会员',min:1500,next:3000},{n:'黑金会员',min:3000,next:null}]
  let lv=LV[0]
  LV.forEach(l=>{if(spend>=l.min)lv=l})
  const need=lv.next?Math.max(lv.next-spend,0):0
  const span=lv.next?lv.next-lv.min:1
  let nextName=''
  LV.forEach(l=>{if(l.min===lv.next)nextName=l.n})
  return {visits:done.length,spend:spend,points:Math.floor(spend/10),
    pending:all.filter(r=>r.status==='pending').length,total:all.length,
    levelName:lv.n,nextName:nextName,need:need,
    progress:lv.next?Math.min(Math.round((spend-lv.min)/span*100),100):100}
}
function firstFreeDate(){
  for(let i=0;i<14;i++){const d=shift(i);if(freeCount(d,S.therapistId)>0)return d}
  return today()
}
function seed(){
  const mk=(n,sid,tid,d,slot,remark)=>{
    const s=svc(sid)
    const t=tid?THERAPISTS.find(x=>x.id===tid):null
    return {id:'bk_demo'+n,orderNo:'YR'+shift(d).replace(/-/g,'')+'-102'+n,serviceId:s.id,serviceName:s.name,
      cover:s.cover,price:s.price,duration:s.duration,therapistId:t?t.id:'',therapistName:t?t.name:'随机安排',
      therapistTitle:t?t.title:'',date:shift(d),slot:slot,name:'傅**',phone:'00000000000',
      remark:remark||'',status:'pending',createdAt:Date.now()}
  }
  RECORDS=[mk(1,'s5','t1',1,'14:30','第一次到店，麻烦先看看皮肤状态'),mk(2,'s1','t2',-9,'11:00',''),mk(3,'s2','t1',-16,'15:30','')]
  S.date=firstFreeDate()
}
function addRecord(){
  const s=svc(S.serviceId)
  if(!S.date||!S.slot) return {ok:false,msg:'请选择到店时间'}
  if(slotState(S.date,S.slot,S.therapistId)==='busy') return {ok:false,msg:'该时段已被预约'}
  if(!S.name.trim()) return {ok:false,msg:'请填写到店人姓名'}
  if(!/^1[3-9]\d{9}$/.test(S.phone)) return {ok:false,msg:'请填写正确的手机号'}
  const t=S.therapistId?THERAPISTS.find(x=>x.id===S.therapistId):null
  const r={id:'bk_'+Date.now(),orderNo:orderNo(),serviceId:s.id,serviceName:s.name,cover:s.cover,price:s.price,
    duration:s.duration,therapistId:t?t.id:'',therapistName:t?t.name:'随机安排',therapistTitle:t?t.title:'',
    date:S.date,slot:S.slot,name:S.name.trim(),phone:S.phone,remark:S.remark.trim(),status:'pending',createdAt:Date.now()}
  RECORDS.unshift(r)
  return {ok:true,data:decorate(r)}
}

function pRecords(){
  const c=countByStatus()
  const list=allRecords().filter(r=>S.filter==='all'||r.status===S.filter)
  const all=allRecords()
  let next=null
  for(let i=all.length-1;i>=0;i--){if(all[i].status==='pending'){next=all[i];break}}
  let cd=''
  if(next){
    const diff=Math.round((parse(next.date)-parse(today()))/86400000)
    cd=diff<=0?'今天到店':(diff===1?'明天到店':'还有 '+diff+' 天')
  }
  const EM={all:['还没有预约记录','选一个适合你的项目，到店由管理师一对一跟进'],
    pending:['没有待服务的预约','可以看看近期热门项目，提前约上时间'],
    done:['还没有已完成的护理','到店完成护理后会记录在这里'],
    canceled:['没有已取消的预约','已取消的记录会保留在这里，可随时重新预约']}
  return `<div class="wrap">
    ${next?`<div class="next">
      <div class="lf"><div class="lb">下次到店</div><div class="wh">${cd}</div></div>
      <div class="rt"><div class="sv" style="overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${next.serviceName}</div>

    <div class="stat">

          <div class="nm">${r.serviceName}</div>
          <div class="ln">${ic('user',{s:13,w:1.7})}<span class="lnt">${r.therapistName}</span>${r.therapistTitle?'<span class="ftig">'+r.therapistTitle+'</span>':''}</div>
          <div class="ln">${ic('clock',{s:13,w:1.7})}<span class="lnt" style="font-weight:600;color:#1E2422">${r.monthDay} 周${r.weekday} ${r.slot}</span></div>

          <div class="btn gho sm" onclick="App.rebook('${r.serviceId}')">再次预约</div>
        </div>
      </div></div>`).join(''):
    `<div class="empty"><img src="assets/icons/calendar.png" alt="">

      <div class="mi" onclick="App.toast('已打开地图导航')"><span class="ico">${ic('location',{s:17,w:1.7})}</span><span class="tx">门店地址</span><span class="vl">${STORE.addressShort}</span><div class="arw" style="color:#98A29C"></div></div>
      <div class="mi" onclick="App.sheet('about')"><span class="ico">${ic('note',{s:17,w:1.7})}</span><span class="tx">关于我们</span><div class="arw" style="color:#98A29C"></div></div>
    </div></div>
    <div class="foot">
      <div class="nm">${STORE.name} · ${STORE.nameEn}</div>
      <div class="ds">${STORE.businessDays} ${STORE.openTime} - ${STORE.closeTime}<br>小程序版本 2.0.0</div>
    </div>
  </div>`
}

function pSheet(){
  const t=S.sheet
  if(!t) return ''
  if(t==='service') return '<div class="mask" onclick="App.sheet(null)"></div><div class="sheet">'+
    '<div class="hd"><span class="t">选择服务项目</span><div class="x" onclick="App.sheet(null)"></div></div>'+
    '<div class="bdy">'+SERVICES.map(s=>`<div class="ssi ${S.serviceId===s.id?'on':''}" onclick="App.pickService('${s.id}')">
      <img src="${s.cover}" alt=""><div style="flex:1"><div class="nm">${s.name}</div><div class="sb">${s.duration} 分钟 · ¥${s.price}</div></div>
      ${S.serviceId===s.id?'<span class="ck">'+ic('check',{s:18,w:2.4})+'</span>':''}</div>`).join('')+'</div></div>'
  if(t==='done'){
    const d=S.doneData
    return '<div class="mask"></div><div class="sheet"><div class="bdy">'+
      '<div class="done-ico">'+ic('check',{s:26,w:2.2})+'</div>'+
      '<div class="done-t">预约已提交</div>'+
      '<div class="done-s">门店将在营业时间内确认，到店请出示订单号</div>'+
      '<div class="done-c">'+
        '<div class="done-r"><span class="l">订单号</span><span class="v">'+d.orderNo+'</span></div>'+
        '<div class="done-r"><span class="l">服务项目</span><span class="v">'+d.serviceName+'</span></div>'+
        '<div class="done-r"><span class="l">指定技师</span><span class="v">'+d.therapistName+'</span></div>'+
        '<div class="done-r"><span class="l">到店时间</span><span class="v">'+d.monthDay+' 周'+d.weekday+' '+d.slot+'</span></div>'+
        '<div class="done-r"><span class="l">到店人</span><span class="v">'+d.name+' '+d.phone+'</span></div>'+
      '</div>'+
      '<div class="acts"><div class="btn out" onclick="App.sheet(null)">继续浏览</div><div class="btn pri" onclick="App.afterDone()">查看预约</div></div>'+
      '</div></div>'
  }
  if(t==='login') return '<div class="mask" onclick="App.sheet(null)"></div><div class="sheet"><div class="bdy">'+
    '<div class="ls-av">'+ic('user',{s:32,w:1.5})+'</div>'+
    '<div class="ls-t">微信快捷登录</div>'+
    '<div class="ls-s">仅用于记录预约与到店核销，不会用于其他用途</div>'+
    '<div class="ls-f"><div class="lb">昵称</div><input id="nick" value="傅硕一" placeholder="填写或选择微信昵称"></div>'+
    '<div class="acts"><div class="btn out" onclick="App.sheet(null)">暂不登录</div><div class="btn pri" onclick="App.doLogin()">确认登录</div></div>'+
    '</div></div>'
  if(t==='benefit') return '<div class="mask" onclick="App.sheet(null)"></div><div class="sheet">'+
    '<div class="hd"><span class="t">会员权益</span><div class="x" onclick="App.sheet(null)"></div></div><div class="bdy">'+
    BENEFITS.map(b=>'<div class="bn"><div class="ic">'+ic(b.icon,{s:19,w:1.7})+'</div><div><div class="t">'+b.title+'</div><div class="d">'+b.desc+'</div></div></div>').join('')+
    '</div></div>'
  if(t==='process') return '<div class="mask" onclick="App.sheet(null)"></div><div class="sheet">'+
    '<div class="hd"><span class="t">服务流程</span><div class="x" onclick="App.sheet(null)"></div></div><div class="bdy">'+
    PROCESS.map(p=>'<div class="ps"><div class="st">'+p.step+'</div><div><div class="t">'+p.title+'</div><div class="d">'+p.desc+'</div></div></div>').join('')+
    '</div></div>'
  if(t==='env') return '<div class="mask" onclick="App.sheet(null)"></div><div class="sheet">'+
    '<div class="hd"><span class="t">门店环境</span><div class="x" onclick="App.sheet(null)"></div></div><div class="bdy">'+
    ENVS.map(e=>'<div class="evi"><img src="'+e.image+'" alt=""><div class="n">'+e.name+'</div><div class="d">'+e.desc+'</div></div>').join('')+
    '</div></div>'
  return '<div class="mask" onclick="App.sheet(null)"></div><div class="sheet">'+
    '<div class="hd"><span class="t">关于我们</span><div class="x" onclick="App.sheet(null)"></div></div><div class="bdy">'+
    '<img src="assets/env/reception.jpg" alt="" style="width:100%;height:150px;border-radius:12px;object-fit:cover">'+
    '<div style="font-size:13px;color:#5C6862;line-height:1.85;margin-top:13px">'+STORE.intro+'</div>'+
    '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:11px">'+STORE.tags.map(x=>'<span class="tag gold" style="height:22px;font-size:10.5px;padding:0 9px">'+x+'</span>').join('')+'</div>'+
    [['营业时间',STORE.businessDays+' '+STORE.openTime+' - '+STORE.closeTime],['门店地址',STORE.address],['联系电话',STORE.phone],['交通指引',STORE.subway]]
      .map(x=>'<div class="ab-row"><span class="l">'+x[0]+'</span><span class="v">'+x[1]+'</span></div>').join('')+
    '</div></div>'
}

/* ================= 渲染 ================= */
const PAGES={home:pHome,service:pService,detail:pDetail,booking:pBooking,records:pRecords,mine:pMine}
function renderNavBar(){
  document.getElementById('nav').innerHTML=NAVITEMS.map(n=>`<div class="nav-item ${S.screen===n.k?'on':''}" onclick="App.go('${n.k}')">
    <div class="nav-ico">${ic(n.i,{s:18,w:1.7})}</div>
    <div class="nav-txt"><div class="nav-t">${n.t}</div><div class="nav-d">${n.d}</div></div>
    <div class="nav-arrow"></div></div>`).join('')
}
function renderChrome(){
  const dark=['home','detail','mine'].indexOf(S.screen)<0
  const sb=document.getElementById('sbar')
  sb.className='sbar'+(dark?' dark':'')
  sb.innerHTML='<span>9:41</span><span class="sbar-r bar-cov"><i></i><i></i><i></i></span>'
  const tb=document.getElementById('tabbar')
  const hide=SECONDARY.indexOf(S.screen)>-1
  tb.className='tabbar'+(hide?' hide':'')
  if(!hide){
    tb.innerHTML=TABS.map(t=>`<div class="tab ${S.screen===t.k?'on':''}" onclick="App.tab('${t.k}')">
      ${ic(t.i,{s:22,w:S.screen===t.k?1.9:1.6})}<span>${t.t}</span></div>`).join('')
  }
}
function render(keepFocus){
  const fn=PAGES[S.screen]||pHome
  document.getElementById('view').innerHTML='<div class="page">'+fn()+'</div>'
  document.getElementById('fbarhost').innerHTML=fbarHTML()
  document.getElementById('layer').innerHTML=pSheet()+(S.toast?'<div class="toast">'+S.toast+'</div>':'')
  renderNavBar();renderChrome()
  if(!keepFocus) document.getElementById('view').scrollTop=0
}
function updateFbar(){
  document.getElementById('fbarhost').innerHTML=fbarHTML()
}

/* ================= 交互 ================= */
window.App={
  go(k){
    if(SECONDARY.indexOf(k)>-1&&SECONDARY.indexOf(S.screen)<0) S.stack.push(S.screen)
    if(k==='booking'&&!S.date) S.date=firstFreeDate()
    S.screen=k
    render()
  },
  tab(k){S.screen=k;S.stack=[];render()},
  detail(id){
    S.serviceId=id
    if(SECONDARY.indexOf(S.screen)<0) S.stack.push(S.screen)
    S.screen='detail'
    render()
  },
  back(){S.screen=S.stack.pop()||'home';render()},
  bookWith(tid,sid){
    if(sid) S.serviceId=sid
    if(tid) S.therapistId=tid
    if(S.therapistId&&svc(S.serviceId).therapistIds.indexOf(S.therapistId)<0) S.therapistId=''
    S.slot=''
    S.date=firstFreeDate()
    if(SECONDARY.indexOf(S.screen)<0) S.stack.push(S.screen)
    S.screen='booking'
    render()
  },
  rebook(sid){
    S.serviceId=sid;S.slot='';S.therapistId='';S.date=firstFreeDate()
    if(SECONDARY.indexOf(S.screen)<0) S.stack.push(S.screen)
    S.screen='booking';render()
  },
  cat(k){S.cat=k;render()},
  kw(v){
    S.kw=v
    const box=document.getElementById('svclist')
    if(box) box.innerHTML=svcListHTML()
    const clr=document.getElementById('kwclr')
    if(clr) clr.style.display=v?'block':'none'
  },
  clearKw(){
    S.kw=''
    const el=document.getElementById('kw')
    if(el){el.value='';el.focus()}
    const box=document.getElementById('svclist')
    if(box) box.innerHTML=svcListHTML()
    const clr=document.getElementById('kwclr')
    if(clr) clr.style.display='none'
  },
  resetFilter(){
    S.cat='all';S.kw=''
    render()
  },
  therapist(id){
    S.therapistId=id
    if(freeCount(S.date,id)===0) S.date=firstFreeDate()
    if(S.slot&&slotState(S.date,S.slot,id)!=='free') S.slot=''
    render()
  },
  date(d){S.date=d;S.slot='';render()},
  slot(v,st){
    if(st!=='free'){this.toast(st==='busy'?'该时段已被预约':'该时段已过');return}
    S.slot=S.slot===v?'':v
    render(true)
  },
  field(k,v){S[k]=v;updateFbar()},
  pickService(id){
    S.serviceId=id;S.sheet=null;S.slot=''
    if(S.therapistId&&svc(id).therapistIds.indexOf(S.therapistId)<0) S.therapistId=''
    S.date=firstFreeDate()
    render()
  },
  sheet(t){S.sheet=t;render(true)},
  submit(){
    const r=addRecord()
    if(!r.ok){this.toast(r.msg);return}
    S.doneData=r.data;S.sheet='done';S.slot=''
    render()
  },
  afterDone(){S.sheet=null;S.screen='records';S.stack=[];render()},
  filter(k){S.filter=k;render()},
  cancel(id){
    const r=RECORDS.filter(x=>x.id===id)[0]
    if(r){r.status='canceled';this.toast('已取消预约');render()}
  },
  login(){S.sheet='login';render(true)},
  doLogin(){
    const el=document.getElementById('nick')
    const nick=(el&&el.value.trim())||'傅硕一'
    S.logged=true;S.nick=nick;S.sheet=null
    if(!S.name){S.name=nick;S.phone='00000000000'}
    this.toast('登录成功');render()
  },
  logout(){S.logged=false;this.toast('已退出登录');render()},
  toast(m){
    S.toast=m;render(true)
    clearTimeout(this._t)
    this._t=setTimeout(()=>{S.toast='';render(true)},1600)
  }
}
seed()
render()
</script>
