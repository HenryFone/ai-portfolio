<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>邻里团 · 社区团购小程序 · 可交互预览</title>
<style>
  :root{
    --brand:#FF6B35; --brand-deep:#E8511A; --brand-soft:#FFF2EA; --brand-line:#FFE0D2;
    --gold:#FFB020; --green:#22A06B; --green-soft:#E9F8F1; --red:#F5333F;
    --ink:#1A1D1F; --ink-2:#5A626E; --ink-3:#9AA0A6; --ink-4:#C4C8CE;
    --line:#F0F1F3; --bg:#F5F6F8; --card:#FFFFFF;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
    background:radial-gradient(1200px 600px at 20% -10%, #FFF6F0 0%, #F5F6F8 55%, #EEF0F4 100%);
    color:var(--ink); -webkit-font-smoothing:antialiased; min-height:100vh; padding:28px 24px 40px;
  }
  .wrap{max-width:1240px;margin:0 auto}

  /* ---------- 顶部 ---------- */
  .topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap}
  .title{font-size:26px;font-weight:800;letter-spacing:.5px}
  .title .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--brand);margin-right:9px;vertical-align:middle;box-shadow:0 0 0 4px rgba(255,107,53,.16)}
  .subtitle{font-size:13px;color:var(--ink-3);margin-top:7px;letter-spacing:.3px}
  .badges{display:flex;gap:8px;flex-wrap:wrap}
  .badge{font-size:12px;color:var(--ink-2);background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;box-shadow:0 2px 8px rgba(20,24,31,.04)}
  .badge b{color:var(--brand-deep);font-weight:700}

  /* ---------- 主体三栏 ---------- */
  .stage{display:flex;gap:26px;align-items:flex-start}
  .col-nav{width:214px;flex:none}
  .col-info{width:262px;flex:none}
  .col-phone{flex:1;display:flex;justify-content:center;min-width:0}

  .panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 10px 30px rgba(20,24,31,.05)}
  .panel-tt{font-size:12px;font-weight:700;color:var(--ink-3);letter-spacing:1.6px;margin-bottom:12px}

  .navitem{display:flex;gap:11px;align-items:center;padding:11px 10px;border-radius:13px;cursor:pointer;transition:.18s;border:1px solid transparent}
  .navitem:hover{background:#FAFBFC}
  .navitem.on{background:var(--brand-soft);border-color:var(--brand-line)}
  .navitem .ic{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
  .navitem .tx b{display:block;font-size:13.5px;font-weight:700;line-height:1.3}
  .navitem .tx span{display:block;font-size:11px;color:var(--ink-3);margin-top:2px}
  .navitem.on .tx b{color:var(--brand-deep)}

  .info-list{list-style:none}
  .info-list li{display:flex;gap:9px;font-size:12.5px;color:var(--ink-2);line-height:1.65;padding:5px 0}
  .info-list li .k{color:var(--brand);flex:none;font-size:12px;margin-top:1px}
  .hint{margin-top:14px;background:linear-gradient(135deg,#FFF8F3,#FFF2EA);border:1px solid var(--brand-line);border-radius:13px;padding:12px 13px;font-size:12.5px;color:var(--brand-deep);line-height:1.7}
  .hint b{display:block;font-size:12px;margin-bottom:4px;letter-spacing:.4px}
  .meta{margin-top:14px;font-size:11.5px;color:var(--ink-4);line-height:1.9;border-top:1px dashed var(--line);padding-top:12px}
  .meta code{background:#F5F6F8;border-radius:5px;padding:1px 5px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--ink-2)}

  /* ---------- 手机 ---------- */
  .phone{width:390px;flex:none;background:linear-gradient(160deg,#2B2F36,#15181C);border-radius:52px;padding:9px;box-shadow:0 30px 70px rgba(20,24,31,.32),0 0 0 1px rgba(255,255,255,.08) inset;position:relative}
  .phone-screen{width:372px;height:760px;border-radius:44px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;position:relative}
  .notch{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:118px;height:26px;background:#111;border-radius:16px;z-index:40}
  .statusbar{height:44px;flex:none;background:var(--brand);display:flex;align-items:flex-end;justify-content:space-between;padding:0 22px 6px;color:#fff;font-size:12px;font-weight:600;letter-spacing:.3px}
  .statusbar .st-r{display:flex;gap:5px;align-items:center;font-size:11px}
  .navbar{height:44px;flex:none;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;position:relative;font-size:16px;font-weight:600;letter-spacing:.5px}
  .navbar .back{position:absolute;left:12px;top:0;height:44px;display:flex;align-items:center;font-size:19px;cursor:pointer;opacity:.95}
  .screen-body{flex:1;overflow-y:auto;overflow-x:hidden;background:var(--bg);scrollbar-width:thin}
  .screen-body::-webkit-scrollbar{width:0}
  .tabbar{height:58px;flex:none;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;padding-bottom:4px}
  .tabbar .tb{flex:1;text-align:center;font-size:10.5px;color:var(--ink-3);cursor:pointer;line-height:1.2;padding-top:6px}
  .tabbar .tb .tbi{font-size:19px;display:block;margin-bottom:2px;filter:grayscale(1);opacity:.55}
  .tabbar .tb.on{color:var(--brand-deep);font-weight:700}
  .tabbar .tb.on .tbi{filter:none;opacity:1}

  /* ---------- 小程序通用样式 ---------- */
  .card{background:#fff;border-radius:14px;padding:14px;margin:0 12px 12px;box-shadow:0 4px 12px rgba(20,24,31,.05)}
  .sec-hd{display:flex;align-items:baseline;justify-content:space-between;margin:4px 12px 10px}
  .sec-tt{font-size:17px;font-weight:700;letter-spacing:.3px}
  .sec-sub{font-size:11px;color:var(--ink-3)}
  .tag{display:inline-block;padding:2px 6px;border-radius:4px;background:var(--brand-soft);color:var(--brand-deep);font-size:10px;margin-right:4px}
  .price{color:var(--red);font-weight:700;font-family:"DIN Alternate",-apple-system,sans-serif}
  .price .sym{font-size:12px;font-weight:600;margin-right:1px}
  .price .int{font-size:20px;letter-spacing:-.3px}
  .price .dec{font-size:13px}
  .price-old{color:var(--ink-3);font-size:11px;text-decoration:line-through;margin-left:6px}
  .bar{height:6px;border-radius:99px;background:#F1F2F4;overflow:hidden}
  .bar-in{height:100%;border-radius:99px;background:linear-gradient(90deg,#FFB36B 0%,#FF6B35 100%);transition:width .4s}
  .footer-tip{text-align:center;font-size:11px;color:var(--ink-4);padding:4px 0 16px;letter-spacing:.5px}
  .dot{color:var(--ink-4);margin:0 4px}

  /* ---------- 首页 ---------- */
  .hero{background:linear-gradient(178deg,#FF6B35 0%,#FF9152 46%,#F4551C 100%);padding:10px 12px 46px;color:#fff}
  .hero-top{display:flex;align-items:center;justify-content:space-between}
  .station{display:flex;align-items:center;gap:6px;cursor:pointer}
  .station-icon{font-size:14px}
  .station-txt .station-label{display:block;font-size:10px;color:rgba(255,255,255,.88);text-shadow:0 1px 2px rgba(0,0,0,.12)}
  .station-txt .station-name{display:block;font-size:13.5px;font-weight:700;margin-top:1px}
  .station-arrow{font-size:11px;opacity:.85;margin-left:2px}
  .hero-icon{position:relative;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer}
  .hi-dot{position:absolute;top:-2px;right:-2px;min-width:16px;height:16px;border-radius:99px;background:#fff;color:var(--brand-deep);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;box-shadow:0 2px 5px rgba(0,0,0,.15)}
  .search{margin-top:12px;height:36px;border-radius:99px;background:#fff;display:flex;align-items:center;padding:0 6px 0 13px;color:var(--ink-3);font-size:13px;cursor:pointer}
  .search .search-go{margin-left:auto;height:28px;padding:0 15px;border-radius:99px;background:linear-gradient(135deg,#FF8A4C,#FF6B35);color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center}
  .hero-note{margin-top:9px;font-size:11px;color:rgba(255,255,255,.92);text-shadow:0 1px 2px rgba(0,0,0,.12)}
  .banner-wrap{margin:-34px 12px 0;position:relative}
  .banners{height:132px;border-radius:14px;overflow:hidden;position:relative;box-shadow:0 8px 20px rgba(20,24,31,.14)}
  .banner{position:absolute;inset:0;opacity:0;transition:opacity .45s ease}
  .banner.on{opacity:1}
  .banner img{width:100%;height:100%;object-fit:cover;display:block}
  .banner-mask{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.52) 0%,rgba(0,0,0,.16) 52%,rgba(0,0,0,0) 78%)}
  .banner-txt{position:absolute;left:16px;bottom:18px;color:#fff}
  .banner-tt{font-size:17px;font-weight:800;letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.25)}
  .banner-sub{font-size:11px;opacity:.92;margin-top:3px}
  .banner-dots{position:absolute;right:14px;bottom:12px;display:flex;gap:4px}
  .bdot{width:5px;height:5px;border-radius:99px;background:rgba(255,255,255,.55)}
  .bdot-on{width:14px;background:#fff}
  .quick{display:flex;margin:14px 12px 4px}
  .quick-item{flex:1;text-align:center;cursor:pointer}
  .quick-icon{width:44px;height:44px;margin:0 auto;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 4px 10px rgba(20,24,31,.12)}
  .quick-name{display:block;font-size:11px;color:var(--ink-2);margin-top:6px}
  .flash-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .flash-tt{font-size:15.5px;font-weight:800}
  .timer{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-2)}
  .timer-num{background:var(--ink);color:#fff;border-radius:5px;padding:2px 6px;font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.5px}
  .timer-urgent .timer-num{background:var(--red);animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.62}}
  .flash-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .flash-scroll::-webkit-scrollbar{display:none}
  .flash-item{flex:none;width:96px;cursor:pointer}
  .flash-pic{position:relative;width:96px;height:96px;border-radius:10px;overflow:hidden;background:#F3F4F6}
  .flash-pic img{width:100%;height:100%;object-fit:cover;display:block}
  .flash-rank{position:absolute;left:0;top:0;background:linear-gradient(135deg,#FF8A4C,#F5333F);color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:10px 0 10px 0}
  .flash-name{font-size:11.5px;margin-top:6px;line-height:1.3;height:30px;overflow:hidden;color:var(--ink)}
  .flash-price .sym{font-size:10px;color:var(--red);font-weight:700}
  .flash-price .int{font-size:16px;color:var(--red);font-weight:700}
  .flash-price .dec{font-size:11px;color:var(--red);font-weight:700}
  .flash-bar{margin-top:5px}
  .flash-tip{font-size:9.5px;color:var(--ink-3);margin-top:4px;white-space:nowrap}
  .coupon-wrap{margin:4px 12px 12px;background:linear-gradient(135deg,#FFF7F2,#FFEFE4);border:1px solid var(--brand-line);border-radius:14px;padding:12px 12px 13px}
  .coupon-hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .coupon-tt{font-size:14px;font-weight:800;color:var(--brand-deep)}
  .coupon-more{font-size:10.5px;color:var(--ink-3)}
  .coupon-scroll{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none}
  .coupon-scroll::-webkit-scrollbar{display:none}
  .coupon{flex:none;width:118px;border-radius:10px;overflow:hidden;display:flex;background:#fff;box-shadow:0 3px 9px rgba(20,24,31,.08);cursor:pointer}
  .coupon-left{flex:1;padding:9px 8px;background:linear-gradient(135deg,#FF9152,#FF6B35);color:#fff}
  .coupon-1 .coupon-left{background:linear-gradient(135deg,#3FC79A,#22A06B)}
  .coupon-2 .coupon-left{background:linear-gradient(135deg,#8A7BFF,#6C5CE7)}
  .coupon-amount{font-weight:800;line-height:1}
  .coupon-amount .ca-sym{font-size:11px}
  .coupon-amount .ca-num{font-size:22px}
  .coupon-cond{font-size:9.5px;opacity:.92;margin-top:4px}
  .coupon-right{width:46px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
  .coupon-tag{font-size:9px;color:var(--brand-deep);background:var(--brand-soft);border-radius:4px;padding:2px 4px;text-align:center}
  .coupon-get{font-size:10px;color:#fff;background:linear-gradient(135deg,#FF8A4C,#FF6B35);border-radius:99px;padding:3px 9px;font-weight:600}
  .leader{display:flex;align-items:center;gap:11px}
  .leader-avatar{width:44px;height:44px;border-radius:50%;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
  .leader-main{flex:1;min-width:0}
  .leader-name{font-size:14px;font-weight:700;display:flex;align-items:center;gap:5px}
  .leader-badge{font-size:9.5px;background:var(--brand);color:#fff;border-radius:4px;padding:1px 5px;font-weight:600}
  .leader-desc{font-size:11px;color:var(--ink-2);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .leader-stats{font-size:10px;color:var(--ink-3);margin-top:3px}
  .leader-btn{flex:none;font-size:12px;color:var(--brand-deep);border:1px solid var(--brand-line);border-radius:99px;padding:5px 13px;cursor:pointer;background:var(--brand-soft);font-weight:600}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px}
  .g-card{background:#fff;border-radius:13px;overflow:hidden;box-shadow:0 4px 12px rgba(20,24,31,.05);cursor:pointer;transition:transform .16s}
  .g-card:hover{transform:translateY(-2px)}
  .g-pic{position:relative;height:118px;background:#F3F4F6}
  .g-pic img{width:100%;height:100%;object-fit:cover;display:block}
  .g-badge{position:absolute;left:0;top:0;background:linear-gradient(135deg,#FF8A4C,#F5333F);color:#fff;font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:13px 0 13px 0}
  .g-body{padding:9px 10px 11px}
  .g-name{font-size:13px;font-weight:600;line-height:1.35;height:35px;overflow:hidden}
  .g-tags{margin-top:5px;height:16px;overflow:hidden}
  .g-foot{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
  .g-plus{width:23px;height:23px;border-radius:50%;background:linear-gradient(135deg,#FF8A4C,#FF6B35);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 3px 8px rgba(255,107,53,.35)}
  .g-sold{font-size:10px;color:var(--ink-3);margin-top:4px}

  /* ---------- 商品列表页 ---------- */
  .gs-top{background:#fff;padding:10px 12px;box-shadow:0 2px 10px rgba(20,24,31,.04);position:sticky;top:0;z-index:5}
  .gs-search{height:34px;border-radius:99px;background:var(--bg);display:flex;align-items:center;padding:0 12px;gap:7px;color:var(--ink-3);font-size:13px}
  .gs-search input{flex:1;border:0;outline:0;background:transparent;font-size:13px;color:var(--ink);font-family:inherit}
  .gs-tabs{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
  .gs-tabs::-webkit-scrollbar{display:none}
  .gs-tab{flex:none;padding:5px 12px;border-radius:99px;background:var(--bg);font-size:12.5px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
  .gs-tab.on{background:var(--brand-soft);color:var(--brand-deep);font-weight:700}
  .gs-sorts{display:flex;align-items:center;gap:14px;margin-top:10px}
  .gs-sort{font-size:12.5px;color:var(--ink-3);cursor:pointer}
  .gs-sort.on{color:var(--brand-deep);font-weight:700}
  .gs-count{margin-left:auto;font-size:11px;color:var(--ink-3)}
  .cg{display:flex;gap:11px;background:#fff;border-radius:13px;padding:11px;margin:0 12px 10px;box-shadow:0 4px 12px rgba(20,24,31,.05);cursor:pointer}
  .pic-box{position:relative;width:96px;height:96px;flex:none;border-radius:10px;overflow:hidden;background:#F3F4F6}
  .pic-box img{width:100%;height:100%;object-fit:cover;display:block}
  .pic-badge{position:absolute;left:0;top:0;background:linear-gradient(135deg,#FF8A4C,#F5333F);color:#fff;font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:10px 0 10px 0}
  .pic-stock{position:absolute;left:0;bottom:0;right:0;background:rgba(0,0,0,.42);color:#fff;font-size:9.5px;text-align:center;padding:2px 0}
  .cg-body{flex:1;min-width:0;display:flex;flex-direction:column}
  .cg-name{font-size:14px;font-weight:600;line-height:1.35}
  .cg-desc{font-size:11px;color:var(--ink-3);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cg-tags{margin-top:5px}
  .cg-meta{font-size:10.5px;color:var(--ink-3);margin-top:4px}
  .cg-meta .score{color:var(--gold);font-weight:700}
  .cg-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:6px}
  .cg-add{font-size:12px;color:#fff;background:linear-gradient(135deg,#FF8A4C,#FF6B35);border-radius:99px;padding:5px 14px;font-weight:600;box-shadow:0 3px 8px rgba(255,107,53,.3)}

  /* ---------- 详情页 ---------- */
  .gallery{position:relative;height:270px;background:#F3F4F6}
  .gal-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
  .gal-img.on{opacity:1}
  .gal-idx{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.42);color:#fff;font-size:11px;border-radius:99px;padding:3px 10px}
  .gal-sold{position:absolute;left:12px;bottom:12px;background:rgba(0,0,0,.42);color:#fff;font-size:11px;border-radius:99px;padding:3px 10px}
  .pc-row{display:flex;align-items:flex-end;justify-content:space-between}
  .pc-right{text-align:right}
  .pc-old{font-size:11px;color:var(--ink-3);text-decoration:line-through}
  .pc-save{display:inline-block;margin-top:4px;font-size:10.5px;color:#fff;background:linear-gradient(135deg,#FF8A4C,#F5333F);border-radius:4px;padding:2px 7px;font-weight:700}
  .pc-title{font-size:17px;font-weight:800;margin-top:8px;line-height:1.35}
  .pc-desc{font-size:12px;color:var(--ink-2);margin-top:5px}
  .pc-tags{margin-top:8px}
  .pc-timer{display:flex;align-items:center;gap:6px;margin-top:11px;background:var(--brand-soft);border-radius:9px;padding:8px 10px;font-size:11.5px;color:var(--brand-deep)}
  .pc-timer-num{font-family:ui-monospace,monospace;font-weight:700;background:#fff;border-radius:4px;padding:1px 6px}
  .pc-timer-sub{margin-left:auto;color:var(--ink-3);font-size:10.5px}
  .gc-hd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px}
  .gc-num{font-size:11.5px;color:var(--brand-deep);font-weight:700}
  .gc-tip{font-size:11.5px;color:var(--ink-2);margin-top:8px}
  .gc-ok{color:var(--green)}
  .joiners{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap}
  .joiner{font-size:10.5px;background:var(--bg);color:var(--ink-2);border-radius:99px;padding:3px 9px}
  .joiner-more{font-size:10.5px;color:var(--ink-3)}
  .block-tt{font-size:13px;font-weight:700}
  .block-tt-mt{margin-top:14px}
  .spec-box{display:flex;align-items:center;gap:9px;margin-top:9px}
  .spec-item{border-radius:8px;padding:6px 13px;font-size:12.5px;border:1px solid var(--line);color:var(--ink-2)}
  .spec-on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-deep);font-weight:700}
  .spec-tip{font-size:11px;color:var(--ink-3)}
  .qty{display:flex;align-items:center;gap:11px;margin-top:9px}
  .st-btn{width:27px;height:27px;border-radius:8px;background:var(--bg);color:var(--ink-2);display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;user-select:none}
  .st-off{opacity:.4;cursor:not-allowed}
  .st-num{font-size:14px;font-weight:700;min-width:20px;text-align:center}
  .qty-tip{font-size:11px;color:var(--ink-3);margin-left:auto}
  .services{display:flex}
  .sv-item{flex:1;text-align:center}
  .sv-icon{font-size:19px;display:block}

/* ---------- 工具 ---------- */
function img(p){ return IMG[p] || '' }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}) }
function money(n){ return Number(n).toFixed(2) }
function parts(n){ const a=money(n).split('.'); return {i:a[0], d:a[1]} }
function pr(n, big){ const p=parts(n); return '<span class="price"><span class="sym">¥</span><span class="int" style="font-size:'+(big||20)+'px">'+p.i+'</span><span class="dec">.'+p.d+'</span></span>' }
function prog(j,t){ return Math.min(100, Math.round(j/t*100)) }
function stars(n){ return new Array(n).fill('★').join('') }

}

function cutdown(){
  const now = new Date();
  const end = new Date(now); end.setHours(22,0,0,0);
  if(now>end) end.setDate(end.getDate()+1);
  let s = Math.floor((end-now)/1000);
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), sec = s%60;
  const p = function(n){return n<10?'0'+n:''+n};
  return p(h)+':'+p(m)+':'+p(sec);
}

        '<div class="rv-time">'+c.time+' · 已取货</div></div></div>';
    }).join('')+
  '</div>'+

  '<div class="bottom-space"></div>'+

  '<div class="footer">'+
    '<div class="ft-icon" onclick="go(\'index\')"><span class="ft-emoji">🏠</span>首页</div>'+
    '<div class="ft-icon" onclick="toggleCart()"><span class="ft-emoji">🛒</span>购物车'+(cartCount?'<span class="ft-badge">'+cartCount+'</span>':'')+'</div>'+
    '<div class="ft-add" onclick="addCart('+g.id+',true)">加入购物车</div>'+
    '<div class="ft-buy" onclick="buyNow()">立即参团 ¥'+total+'</div>'+
  '</div>'+

  (S.cartOpen?'<div class="mask" onclick="toggleCart()"></div>':'')+
  '<div class="drawer '+(S.cartOpen?'drawer-on':'')+'">'+
    '<div class="dw-hd"><span class="dw-tt">购物车 · '+cartCount+' 件</span><span class="dw-clear" onclick="clearCart()">清空</span></div>'+
    '<div class="dw-list">'+ (S.cart.length? S.cart.map(function(it){
        return '<div class="dw-item"><img class="dw-img" src="'+img(it.image)+'"/>'+
          '<div class="dw-info"><div class="dw-name">'+esc(it.name)+'</div><div class="dw-spec">'+esc(it.spec)+'</div>'+
          '<div class="dw-price">¥'+money(it.price)+'</div></div>'+
          '<div class="stepper"><span class="st-btn" onclick="cartCh('+it.goodsId+',-1)">－</span><span class="st-num">'+it.count+'</span>'+
          '<span class="st-btn" onclick="cartCh('+it.goodsId+',1)">＋</span></div></div>';
      }).join('') : '<div class="dw-empty"><span class="dw-empty-emoji">🛒</span>购物车还是空的</div>') +
    '</div>'+
    '<div class="dw-foot"><div class="dw-total"><span class="dw-label">合计</span><span class="dw-amount">¥'+cartAmount().toFixed(2)+'</span></div>'+
      '<div class="dw-settle '+(S.cart.length?'':'dw-off')+'" onclick="settle()">去结算（'+cartCount+'）</div></div>'+
  '</div>';
}
function chCount(d){ const n=S.count+d; if(n<1||n>10) return; S.count=n; render(); }
function cartAmount(){ return S.cart.reduce(function(s,i){return s+i.price*i.count},0) }
function addCart(id, silent){
  const g = byId(id);
  const hit = S.cart.filter(function(i){return i.goodsId===id})[0];
  if(hit) hit.count = Math.min(hit.count+1,10);
  else S.cart.push({goodsId:g.id,name:g.name,image:g.image,spec:g.spec,price:g.price,count:1});
  if(S.page!=='detail') toast('已加入购物车：'+g.name);
  else if(silent) toast('已加入购物车');
  render();
}
function cartCh(id,d){
  const next=[];
  S.cart.forEach(function(i){
    if(i.goodsId!==id){ next.push(i); return }
    const n=i.count+d; if(n>0) next.push({goodsId:i.goodsId,name:i.name,image:i.image,spec:i.spec,price:i.price,count:Math.min(n,10)});
  });
  S.cart=next; render();
}
function clearCart(){ S.cart=[]; render(); }
function toggleCart(){ S.cartOpen=!S.cartOpen; render(); }
function buyNow(){ const g=byId(S.goodsId); if(!S.cart.filter(function(i){return i.goodsId===g.id})[0]) S.cart.push({goodsId:g.id,name:g.name,image:g.image,spec:g.spec,price:g.price,count:S.count}); settle(); }
function settle(){
  if(!S.cart.length){ toast('购物车是空的'); return }
  const amount = cartAmount().toFixed(2);
  const count = S.cart.reduce(function(s,i){return s+i.count},0);
  S.orderStatus.unshift('待取货');
  const items = S.cart.slice();
  S.seedOrders = (S.seedOrders||SEED_ORDERS);
  const stamp = 'NT2026101'+Math.floor(Math.random()*9)+Math.floor(Math.random()*9000+1000);
  S.seedOrders.unshift({ id:stamp, status:'待取货', pickup:PICKUP, time:'10-15 刚刚', items:items.map(function(i){return {goodsId:i.goodsId,count:i.count}}) });
  S.cart=[]; S.cartOpen=false;
  toast('下单成功 · '+count+' 件 ¥'+amount);
  go('orders');
}

/* ---------- 订单 ---------- */
function viewOrders(){
  const orders = (S.seedOrders||SEED_ORDERS).map(orderView);
  const tabs = ['全部','待取货','已完成'];
  const list = S.orderTab==='全部' ? orders : orders.filter(function(o){return o.status===S.orderTab});
  const cnt = function(t){ return t==='全部'?orders.length:orders.filter(function(o){return o.status===t}).length };

  return '' +
  '<div class="od-tabs">'+ tabs.map(function(t){
    return '<div class="od-tab '+(S.orderTab===t?'on':'')+'" onclick="setOrderTab(\''+t+'\')">'+t+'<span class="cnt">'+cnt(t)+'</span></div>';
  }).join('') +'</div>'+
  (list.length ? '<div style="height:10px"></div>'+ list.map(function(o){
      return '<div class="order">'+
        '<div class="od-hd"><span>🧾 '+o.id+'</span><span class="od-status '+(o.status==='已完成'?'od-done':'')+'">'+(o.status==='已完成'?'✅ 已完成':'⏳ 待取货')+'</span></div>'+
        o.items.map(function(it){
          return '<div class="od-item" onclick="openGoods('+it.goodsId+')"><img class="od-img" src="'+img(it.image)+'"/>'+
            '<div class="od-info"><div class="od-name">'+esc(it.name)+'</div><div class="od-spec">'+esc(it.spec)+'</div></div>'+
            '<div class="od-right"><div class="od-price">¥'+it.priceText+'</div><div class="od-count">× '+it.count+'</div></div></div>';
        }).join('')+
        '<div class="od-sum"><span class="od-sum-count">共 '+o.count+' 件</span><span>实付</span><span class="od-sum-amount">¥'+o.amountText+'</span></div>'+
        '<div class="od-foot"><span>📍 '+esc(o.pickup)+'</span><span>'+o.timeText+'</span></div>'+
        '<div class="od-actions"><span class="od-btn od-btn-line" onclick="reorder(\''+o.id+'\')">再来一单</span>'+
          (o.status==='待取货'?'<span class="od-btn od-btn-primary" onclick="receive(\''+o.id+'\')">确认取货</span>':'')+
        '</div>'+
      '</div>';
    }).join('')+'<div class="footer-tip">— 只显示本机订单记录 —</div>'
    : '<div class="empty"><span class="empty-emoji">'+(S.orderTab==='已完成'?'📦':'🛒')+'</span>'+
      '<div class="empty-tt">'+esc(S.orderTab==='已完成'?'还没有已完成的订单':'还没有待取货的订单')+'</div>'+
      '<div class="empty-sub">今日 22:00 前下单，明日 16:00 到点自提</div>'+
      '<div class="empty-btn" onclick="go(\'index\')">去逛逛今日团购</div></div>'
  );
}
function setOrderTab(t){ S.orderTab=t; render(); }
function receive(id){
  const list=(S.seedOrders||SEED_ORDERS);
  const hit=list.filter(function(o){return o.id===id})[0];
  if(hit){ hit.status='已完成'; hit.time='10-15 已取货' }
  S.orderStatus = list.map(function(o){return o.status});
  toast('已确认取货，订单完成');
  render();
}
function reorder(id){
  const list=(S.seedOrders||SEED_ORDERS);
  const hit=list.filter(function(o){return o.id===id})[0];
  if(!hit) return;
  hit.items.forEach(function(it){ const g=byId(it.goodsId); if(g) addCartSilent(g, it.count) });
  toast('已加入购物车，去结算即可');
}
function addCartSilent(g,count){
  const hit=S.cart.filter(function(i){return i.goodsId===g.id})[0];
  if(hit) hit.count=Math.min(hit.count+count,10);
  else S.cart.push({goodsId:g.id,name:g.name,image:g.image,spec:g.spec,price:g.price,count:count});
}

/* ---------- 我的 ---------- */
function viewMine(){
  const orders=(S.seedOrders||SEED_ORDERS);
  const done=orders.filter(function(o){return o.status==='已完成'}).length;
  const waiting=orders.filter(function(o){return o.status==='待取货'}).length;
  const spent=orders.map(orderView).reduce(function(s,o){return s+Number(o.amountText)},0).toFixed(2);
  const cartCount=S.cart.reduce(function(s,i){return s+i.count},0);

  return '' +
  '<div class="mine-hero">'+
    '<div class="profile">'+
      '<div class="avatar">🧑<span class="avatar-edit">✎</span></div>'+
      '<div>'+
        '<div class="nick-row"><span class="nick">邻家小张</span><span class="level">社区会员</span></div>'+
        '<div class="mine-sub">已通过微信授权登录 · 下单身份已绑定</div>'+
      '</div>'+
    '</div>'+
    '<div class="hero-stats">'+
      '<div class="hs-item"><span class="hs-num">'+orders.length+'</span><span class="hs-label">累计订单</span></div>'+
      '<span class="hs-line"></span>'+
      '<div class="hs-item"><span class="hs-num">'+spent+'</span><span class="hs-label">累计消费(元)</span></div>'+
      '<span class="hs-line"></span>'+
      '<div class="hs-item"><span class="hs-num">1280</span><span class="hs-label">可用积分</span></div>'+
    '</div>'+
  '</div>'+

  '<div class="card">'+
    '<div class="oc-hd"><span class="oc-tt">我的订单</span><span class="oc-more" onclick="setOrderTab(\'全部\');go(\'orders\')">全部订单 ›</span></div>'+
    '<div class="oc-grid">'+
      ocItem('⏳','待取货',waiting,function(){return 'setOrderTab(\'待取货\');go(\'orders\')'})+
      ocItem('✅','已完成',0,function(){return 'setOrderTab(\'已完成\');go(\'orders\')'})+
      ocItem('📋','全部订单',0,function(){return 'setOrderTab(\'全部\');go(\'orders\')'})+
      ocItem('🛒','购物车',cartCount,function(){return 'toggleCartMine()'})+
    '</div>'+
  '</div>'+

  '<div class="card">'+
    '<div class="cc-hd"><span class="cc-tt">🎁 我的券包</span><span class="cc-more">下单自动抵扣</span></div>'+
    COUPON_VIEW.map(function(c){
      return '<div class="cc-item"><span class="cc-amount">¥'+c.amount+'</span>'+
        '<div><div class="cc-label">'+c.label+'</div><span class="cc-tag">'+c.tag+'</span></div></div>';
    }).join('')+
  '</div>'+

  '<div class="card"><div class="leader-row" onclick="toast(\'团长 '+LEADER.name+' · 服务 '+LEADER.households+' 户\')">'+
    '<div class="leader-avatar">'+LEADER.avatar+'</div>'+
    '<div class="leader-main"><div class="leader-name">'+LEADER.name+' <span class="leader-badge">团长</span></div>'+
    '<div class="leader-desc">'+esc(LEADER.station)+' · 已服务 '+LEADER.households+' 户</div></div>'+
    '<span class="row-arrow">›</span></div></div>'+

  '<div class="card list-card">'+
    '<div class="row" onclick="toast(\'可切换：阳光社区 3 号门 / 海棠苑便利店 / 枫林西门驿站\')"><span class="row-icon">📍</span><span>自提点</span><span class="row-value">'+esc(PICKUP)+'</span><span class="row-arrow">›</span></div>'+
    '<div class="row" onclick="toast(\'今日 22:00 截单 · 明日 16:00 到点自提\')"><span class="row-icon">🚚</span><span>配送说明</span><span class="row-value">今日下单 · 明日自提</span><span class="row-arrow">›</span></div>'+
    '<div class="row" onclick="toast(\'邻里团 v1.0 · 社区团购小程序\')"><span class="row-icon">ℹ️</span><span>关于邻里团</span><span class="row-value">v1.0</span><span class="row-arrow">›</span></div>'+
  '</div>'+

  '<div class="card list-card">'+
    '<div class="row" onclick="toast(\'已退出登录（演示）\')"><span class="row-icon">🔒</span><span class="danger">退出登录</span><span class="row-arrow">›</span></div>'+
    '<div class="row" onclick="toast(\'已清空本机订单与购物车（演示）\')"><span class="row-icon">🗑️</span><span class="danger">清空本机数据</span><span class="row-arrow">›</span></div>'+
  '</div>'+

  '<div class="footer-tip">邻里团 v1.0 · 订单与登录信息保存在本机</div>';
}
function ocItem(emoji,name,badge,fn){
  return '<div class="oc-item" onclick="'+fn()+'"><span class="oc-emoji">'+emoji+'</span><span class="oc-name">'+name+'</span>'+
    (badge?'<span class="oc-badge">'+badge+'</span>':'')+'</div>';
}
function toggleCartMine(){ if(S.cart.length){ toast('购物车共 '+S.cart.reduce(function(s,i){return s+i.count},0)+' 件，去详情页结算') } else toast('购物车还是空的') }

/* ---------- 全局 ---------- */
const RENDER = { index:viewIndex, goods:viewGoods, detail:viewDetail, orders:viewOrders, mine:viewMine };

let toastTimer=null;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ t.classList.remove('on') },1900);
}

render();

setInterval(function(){
  S.banner=(S.banner+1)%BANNERS.length;
  const bs=document.querySelectorAll('.banner'), ds=document.querySelectorAll('.bdot');
  if(bs.length){ bs.forEach(function(b,i){ b.classList.toggle('on', i===S.banner) });
    ds.forEach(function(d,i){ d.classList.toggle('bdot-on', i===S.banner) }); }
  const t=cutdown();
  const c1=document.getElementById('cd1'), c2=document.getElementById('cd2');
  if(c1) c1.textContent=t; if(c2) c2.textContent=t;
},1000);

setInterval(function(){
  const now=new Date();
  document.getElementById('clock').textContent = now.getHours()+':'+ (now.getMinutes()<10?'0':'') + now.getMinutes();
},30000);

/* 键盘：← → 切换页面，1~5 直达 */
document.addEventListener('keydown', function(e){
  if(e.target && e.target.tagName === 'INPUT') return;
  const i = PAGES.map(function(p){return p.key}).indexOf(S.page);
  if(e.key==='ArrowRight'){ go(PAGES[(i+1)%PAGES.length].key) }
  else if(e.key==='ArrowLeft'){ go(PAGES[(i-1+PAGES.length)%PAGES.length].key) }
  else if(e.key>='1' && e.key<='5'){ go(PAGES[Number(e.key)-1].key) }
});
</script>
