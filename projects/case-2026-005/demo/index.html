<style>
/* ============ 设计令牌 ============ */
:root{
  --bg:#f6f5f1; --bg-soft:#efeee8; --card:#ffffff; --text:#16161a; --muted:#6e6e74; --faint:#a2a2a8;
  --line:#e4e3dd; --line-strong:#cfcec7; --accent:#16161a; --accent-contrast:#ffffff;
  --code-bg:#edeae3; --quote-bg:#fbfaf6; --shadow:0 1px 2px rgba(20,20,24,.04),0 10px 30px rgba(20,20,24,.06);
  --serif:Georgia,"Times New Roman","Songti SC","Noto Serif SC","SimSun",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:"SF Mono",SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace;
  --ease:cubic-bezier(.22,.61,.36,1);
}
[data-theme="dark"]{
  --bg:#101012; --bg-soft:#161619; --card:#17171a; --text:#edeae3; --muted:#9c9c96; --faint:#6a6a66;
  --line:#26262a; --line-strong:#38383e; --accent:#edeae3; --accent-contrast:#101012;
  --code-bg:#1e1e22; --quote-bg:#1a1a1e; --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.4);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased;transition:background .4s var(--ease),color .4s var(--ease)}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
::selection{background:var(--accent);color:var(--accent-contrast)}
button{font-family:var(--sans)}

/* ============ 阅读进度条 ============ */
#progress{position:fixed;top:0;left:0;height:2px;width:0;background:var(--accent);z-index:300;transition:width .1s linear}

/* ============ 导航 ============ */
.nav{position:sticky;top:0;z-index:100;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav-inner{max-width:1080px;margin:0 auto;padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font-family:var(--serif);font-size:20px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:10px;flex:none}
.brand-dot{width:11px;height:11px;background:var(--accent);border-radius:3px;transition:transform .3s var(--ease)}
.brand:hover .brand-dot{transform:rotate(45deg)}
.nav-links{display:flex;align-items:center;gap:2px;flex-wrap:nowrap}
.nav-links a,.nav-links button{padding:6px 13px;font-size:14px;color:var(--muted);border-radius:7px;background:none;border:none;cursor:pointer;transition:color .15s,background .15s;white-space:nowrap}
.nav-links a:hover,.nav-links button:hover{color:var(--text);background:var(--bg-soft)}
.nav-links a.active{color:var(--text);font-weight:600}
.nav-user{display:flex;align-items:center;gap:6px}
.nav-avatar{width:27px;height:27px;border-radius:50%;background:var(--accent);color:var(--accent-contrast);font-size:12.5px;display:flex;align-items:center;justify-content:center;font-weight:600;flex:none}
.icon-btn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--muted);transition:all .2s var(--ease);flex:none}
.icon-btn:hover{color:var(--text);border-color:var(--line-strong);transform:translateY(-1px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 20px;border-radius:8px;font-size:14px;cursor:pointer;transition:all .2s var(--ease);border:1px solid transparent;white-space:nowrap}
.btn-dark{background:var(--accent);color:var(--accent-contrast);border-color:var(--accent)}
.btn-dark:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.btn-ghost{background:transparent;color:var(--text);border-color:var(--line-strong)}
.btn-ghost:hover{border-color:var(--text);transform:translateY(-2px)}
.btn-sm{padding:6px 13px;font-size:13px;border-radius:7px}
.btn-danger{background:transparent;color:#b04a4a;border-color:#e6cfcf}
.btn-danger:hover{background:#b04a4a;color:#fff;border-color:#b04a4a}
[data-theme="dark"] .btn-danger{color:#d98080;border-color:#4a2e2e}

/* ============ 布局 ============ */
.wrap{max-width:1080px;margin:0 auto;padding:0 24px 90px}
.footer{border-top:1px solid var(--line);padding:34px 24px 40px;background:var(--bg-soft)}
.footer-inner{max-width:1080px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-start;gap:30px;flex-wrap:wrap}
.footer .f-brand{font-family:var(--serif);font-size:18px;font-weight:700;margin-bottom:8px}
.footer p{font-size:13px;color:var(--faint);line-height:1.7}
.footer .f-links{display:flex;gap:18px;font-size:13px;color:var(--muted)}
.footer .f-links a:hover{color:var(--text)}

/* ============ 入场动画 ============ */
[data-reveal]{opacity:0;transform:translateY(20px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
[data-reveal].in{opacity:1;transform:none}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.page-enter{animation:fadeUp .5s var(--ease)}
@media (prefers-reduced-motion:reduce){
  [data-reveal]{opacity:1;transform:none;transition:none}
  .page-enter{animation:none}
  html{scroll-behavior:auto}
}

/* ============ Hero ============ */
.hero{position:relative;margin:0 -24px;padding:88px 24px 64px;overflow:hidden;border-bottom:1px solid var(--line)}
.hero-bg{position:absolute;inset:0;background:url("images/hero-texture.jpg") center/cover no-repeat;opacity:.55;pointer-events:none}
[data-theme="dark"] .hero-bg{opacity:.07;filter:invert(1)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 55%,var(--bg) 100%);pointer-events:none}
.hero-inner{position:relative;z-index:2;max-width:1080px;margin:0 auto}
.hero-kicker{font-size:12px;letter-spacing:3px;color:var(--faint);text-transform:uppercase;margin-bottom:20px;display:flex;align-items:center;gap:12px}
.hero-kicker::before{content:"";width:34px;height:1px;background:var(--faint)}
.hero h1{font-family:var(--serif);font-size:clamp(40px,6.5vw,72px);line-height:1.08;font-weight:700;letter-spacing:.5px;margin-bottom:22px;max-width:14em}
.hero h1 em{font-style:italic;position:relative;white-space:nowrap}
.hero h1 em::after{content:"";position:absolute;left:0;right:0;bottom:.08em;height:.34em;background:var(--accent);opacity:.12;z-index:-1}
.hero p{color:var(--muted);max-width:560px;font-size:16px;line-height:1.85}
.hero-cta{display:flex;gap:12px;margin-top:34px;flex-wrap:wrap}
.hero-stats{display:flex;gap:44px;margin-top:52px;padding-top:26px;border-top:1px solid var(--line)}
.stat b{font-family:var(--serif);font-size:32px;font-weight:700;display:block;line-height:1.1}
.stat span{font-size:12.5px;color:var(--faint);letter-spacing:.5px}

/* ============ 章节标题 ============ */
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:64px 0 26px;gap:16px}
.section-head .kicker{font-size:12px;letter-spacing:2.5px;color:var(--faint);text-transform:uppercase;margin-bottom:8px}
.section-head h2{font-family:var(--serif);font-size:27px;font-weight:700;letter-spacing:.4px}
.section-head .more{font-size:13.5px;color:var(--muted);transition:color .15s;flex:none}
.section-head .more:hover{color:var(--text)}

/* ============ 特色文章大卡 ============ */
.feature{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .35s}
.feature:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--line-strong)}
.feature-cover{position:relative;aspect-ratio:16/7.4;overflow:hidden;background:var(--bg-soft)}
.feature-cover img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
.feature:hover .feature-cover img{transform:scale(1.04)}
.feature-badge{position:absolute;top:16px;left:16px;background:var(--accent);color:var(--accent-contrast);font-size:12px;letter-spacing:1.5px;padding:5px 12px;border-radius:99px}
.feature-body{padding:28px 32px 30px}
.feature-body h3{font-family:var(--serif);font-size:clamp(21px,2.6vw,27px);font-weight:700;line-height:1.4;margin:10px 0 10px;letter-spacing:.3px}
.feature-body .excerpt{color:var(--muted);font-size:14.5px;line-height:1.8;max-width:640px}

/* ============ 文章列表行 ============ */
.post-list{display:flex;flex-direction:column}
.post-row{display:grid;grid-template-columns:52px 1fr auto;gap:22px;align-items:center;padding:26px 4px;border-bottom:1px solid var(--line);transition:background .2s}
.post-row:hover{background:var(--card)}
.post-num{font-family:var(--mono);font-size:13px;color:var(--faint);letter-spacing:1px}
.post-row:hover .post-num{color:var(--text)}
.post-main{min-width:0}
.post-main h3{font-family:var(--serif);font-size:20.5px;font-weight:700;line-height:1.45;letter-spacing:.3px;transition:opacity .15s;margin-bottom:6px}
.post-row:hover .post-main h3{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.post-main .excerpt{color:var(--muted);font-size:13.5px;line-height:1.7;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.post-meta{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--faint);margin-bottom:8px;flex-wrap:wrap}
.post-meta .dot{width:3px;height:3px;border-radius:50%;background:var(--line-strong)}
.post-thumb{width:104px;height:70px;border-radius:9px;overflow:hidden;border:1px solid var(--line);background:var(--bg-soft);flex:none}
.post-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
.post-row:hover .post-thumb img{transform:scale(1.07)}
.tag-row{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-size:12px;padding:3px 12px;border:1px solid var(--line-strong);border-radius:99px;color:var(--muted);background:var(--card);transition:all .18s var(--ease)}
.chip:hover{color:var(--text);border-color:var(--text);transform:translateY(-1px)}
.chip.solid{background:var(--accent);color:var(--accent-contrast);border-color:var(--accent)}

/* ============ 搜索 ============ */
.search-row{display:flex;align-items:center;gap:12px;margin:36px 0 8px}
.search-box{flex:1;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 16px;transition:border-color .15s,box-shadow .15s}
.search-box:focus-within{border-color:var(--text);box-shadow:var(--shadow)}
.search-box input{flex:1;border:none;outline:none;background:none;font-size:14px;font-family:var(--sans);color:var(--text)}
.search-box svg{flex:none;opacity:.45}
.search-box kbd{font-family:var(--mono);font-size:11px;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.empty{padding:64px 20px;text-align:center;color:var(--faint);background:var(--card);border:1px dashed var(--line-strong);border-radius:14px}
.empty b{display:block;color:var(--muted);font-size:15px;margin-bottom:6px;font-weight:600}

/* ============ 文章详情 ============ */
.back-link{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--muted);margin:36px 0 24px;transition:color .15s,gap .15s}
.back-link:hover{color:var(--text);gap:10px}
.article-layout{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:56px;align-items:start}
.article{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:48px 52px 44px;min-width:0}
.article-head{margin-bottom:32px;padding-bottom:26px;border-bottom:1px solid var(--line)}
.article-head h1{font-family:var(--serif);font-size:clamp(28px,4vw,40px);line-height:1.32;font-weight:700;letter-spacing:.4px;margin:14px 0 16px}
.article-cover{border-radius:12px;margin-bottom:32px;border:1px solid var(--line);width:100%}
.article-foot{margin-top:40px;padding-top:24px;border-top:1px solid var(--line)}
/* 侧栏 TOC */
.toc{position:sticky;top:88px;font-size:13px}
.toc-title{font-size:11.5px;letter-spacing:2px;color:var(--faint);text-transform:uppercase;margin-bottom:14px}
.toc a{display:block;padding:5px 0 5px 14px;color:var(--muted);border-left:1px solid var(--line);line-height:1.5;transition:color .15s,border-color .15s}
.toc a:hover{color:var(--text)}
.toc a.active{color:var(--text);border-color:var(--text);font-weight:600}
.toc a.lv3{padding-left:26px;font-size:12.5px}
/* 上下篇 + 相关 */
.post-nav{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:36px}
.post-nav a{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px;transition:all .25s var(--ease)}
.post-nav a:hover{border-color:var(--text);transform:translateY(-2px)}
.post-nav .dir{font-size:12px;color:var(--faint);letter-spacing:1.5px;margin-bottom:7px;text-transform:uppercase}
.post-nav h4{font-family:var(--serif);font-size:16px;font-weight:700;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.post-nav a.next{text-align:right}
.related{margin-top:44px}
.related-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.related-grid a{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;transition:all .25s var(--ease)}
.related-grid a:hover{border-color:var(--text);transform:translateY(-2px)}
.related-grid .r-thumb{width:64px;height:48px;border-radius:7px;overflow:hidden;flex:none;background:var(--bg-soft)}
.related-grid .r-thumb img{width:100%;height:100%;object-fit:cover}
.related-grid h4{font-size:14px;font-weight:600;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ============ Markdown 排版 ============ */
.md{font-size:15.5px;line-height:1.95}
.md h1,.md h2,.md h3,.md h4{font-family:var(--serif);font-weight:700;line-height:1.42;margin:1.7em 0 .7em;scroll-margin-top:90px}
.md h1{font-size:27px}.md h2{font-size:22.5px}.md h3{font-size:18.5px}.md h4{font-size:16px}
.md h2{padding-bottom:9px;border-bottom:1px solid var(--line)}
.md p{margin:1.05em 0}
.md a{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-strong);transition:text-decoration-color .15s}
.md a:hover{text-decoration-color:var(--text)}
.md strong{font-weight:700}
.md del{color:var(--faint)}
.md code{font-family:var(--mono);font-size:.87em;background:var(--code-bg);border:1px solid var(--line);border-radius:5px;padding:1.5px 6px}
.md pre{background:#1b1b1e;color:#e9e7e2;border-radius:12px;padding:20px 22px;overflow-x:auto;margin:1.4em 0;font-size:13.5px;line-height:1.75}
.md pre code{background:none;border:none;padding:0;color:inherit;font-size:inherit}
.md blockquote{border-left:3px solid var(--accent);background:var(--quote-bg);padding:12px 20px;margin:1.3em 0;color:var(--muted);border-radius:0 10px 10px 0}
.md blockquote p{margin:.4em 0}
.md ul,.md ol{margin:1.05em 0;padding-left:1.7em}
.md li{margin:.38em 0}
.md li::marker{color:var(--faint)}
.md img{border-radius:12px;border:1px solid var(--line);margin:1.4em auto}
.md hr{border:none;border-top:1px solid var(--line);margin:2.3em 0}
.md table{width:100%;border-collapse:collapse;margin:1.4em 0;font-size:14px}
.md th,.md td{border:1px solid var(--line);padding:9px 14px;text-align:left}
.md th{background:var(--quote-bg);font-weight:600}
.md tr:nth-child(even) td{background:var(--quote-bg)}
.md .timeline{margin:1.6em 0;border-left:2px solid var(--line);padding-left:26px;display:flex;flex-direction:column;gap:22px;list-style:none}
.md .timeline .t-item{position:relative}
.md .timeline .t-item::before{content:"";position:absolute;left:-33px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--accent)}
.md .timeline .t-date{font-family:var(--mono);font-size:12px;color:var(--faint);letter-spacing:.5px}
.md .timeline .t-title{font-weight:700;font-size:15px;margin:3px 0 2px}
.md .timeline .t-desc{font-size:13.5px;color:var(--muted);line-height:1.7}

/* ============ 标签页 ============ */
.tag-cloud{display:flex;flex-wrap:wrap;gap:11px}
.tag-cloud .chip{font-size:14px;padding:8px 18px;border-radius:99px}
.tag-cloud .chip b{font-weight:600;margin-left:6px;color:var(--faint);font-family:var(--mono);font-size:12px}

/* ============ 关于页 ============ */
.about-grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:44px;align-items:start}
.about-card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;position:sticky;top:88px}
.about-card .avatar{aspect-ratio:1/1.08;background:var(--bg-soft)}
.about-card .avatar img{width:100%;height:100%;object-fit:cover}
.about-card .a-body{padding:22px 24px}
.about-card .a-name{font-family:var(--serif);font-size:20px;font-weight:700;margin-bottom:4px}
.about-card .a-role{font-size:13px;color:var(--muted);line-height:1.6}
.about-card .a-stats{display:flex;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.about-card .a-stats .stat{flex:1;text-align:center}
.about-card .a-stats b{font-family:var(--serif);font-size:20px;font-weight:700;display:block;line-height:1.2}
.about-card .a-stats span{font-size:11.5px;color:var(--faint)}

/* ============ 表单 ============ */
.form-page{max-width:440px;margin:56px auto}
.form-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:38px}
.form-card h1{font-family:var(--serif);font-size:26px;font-weight:700;margin-bottom:6px}
.form-card .sub{color:var(--muted);font-size:13.5px;margin-bottom:28px}
.field{margin-bottom:17px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:7px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line-strong);border-radius:9px;padding:11px 14px;font-size:14px;font-family:var(--sans);background:var(--bg);color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s}
.field input:focus,.field textarea:focus{border-color:var(--text);box-shadow:var(--shadow)}
.form-note{font-size:12.5px;color:var(--muted);background:var(--quote-bg);border:1px solid var(--line);border-radius:9px;padding:11px 14px;margin-bottom:18px;line-height:1.65}
.form-err{font-size:13px;color:#b04a4a;background:#faf2f2;border:1px solid #eedddd;border-radius:9px;padding:10px 14px;margin-bottom:16px;display:none}
[data-theme="dark"] .form-err{color:#d98080;background:#241616;border-color:#402626}
.form-switch{text-align:center;font-size:13.5px;color:var(--muted);margin-top:22px}
.form-switch a{text-decoration:underline;text-underline-offset:3px;font-weight:600}

/* ============ 后台 ============ */
.admin-head{display:flex;align-items:center;justify-content:space-between;margin:44px 0 26px;flex-wrap:wrap;gap:12px}
.admin-head h1{font-family:var(--serif);font-size:29px;font-weight:700}
.admin-head .sub{font-size:13px;color:var(--faint);width:100%;margin-top:-8px}
.admin-actions{display:flex;gap:8px;flex-wrap:wrap}
.admin-table{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.admin-table table{width:100%;border-collapse:collapse;font-size:14px}
.admin-table th{background:var(--quote-bg);font-weight:600;color:var(--muted);font-size:12.5px;text-align:left;padding:12px 18px;border-bottom:1px solid var(--line);letter-spacing:.5px}
.admin-table td{padding:13px 18px;border-bottom:1px solid var(--line);vertical-align:middle}

/* ============================================================
 * 1. 本地数据层（IndexedDB）

var DB_NAME = "ai-tools-blog", DB_VER = 1, dbRef = null;

function openDB() {
  return new Promise(function (resolve, reject) {
    var req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = function (e) {
      var db = e.target.result;
      if (!db.objectStoreNames.contains("posts"))
        db.createObjectStore("posts", { keyPath: "id", autoIncrement: true });
      if (!db.objectStoreNames.contains("users")) {
        var s = db.createObjectStore("users", { keyPath: "id", autoIncrement: true });
        s.createIndex("email", "email", { unique: true });
      }
      if (!db.objectStoreNames.contains("attachments"))
        db.createObjectStore("attachments", { keyPath: "id" });
      if (!db.objectStoreNames.contains("meta"))
        db.createObjectStore("meta", { keyPath: "k" });
    };
    req.onsuccess = function () { dbRef = req.result; resolve(req.result); };
    req.onerror = function () { reject(req.error); };
  });
}
function tx(store, mode) { return dbRef.transaction(store, mode).objectStore(store); }
function dbReq(r) { return new Promise(function (res, rej) { r.onsuccess = function () { res(r.result); }; r.onerror = function () { rej(r.error); }; }); }
function dbGet(store, key) { return dbReq(tx(store, "readonly").get(key)); }
function dbAll(store) { return dbReq(tx(store, "readonly").getAll()); }
function dbPut(store, val) {
  if (val && typeof val === "object" && val.id === undefined) { val = Object.assign({}, val); delete val.id; }
  return dbReq(tx(store, "readwrite").put(val));
}
function dbDel(store, key) { return dbReq(tx(store, "readwrite").delete(key)); }
function dbCount(store) { return dbReq(tx(store, "readonly").count()); }

function b64(buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); }
function ub64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
function hashPassword(pw, saltB64) {
  var salt = saltB64 ? ub64(saltB64) : crypto.getRandomValues(new Uint8Array(16));
  var saltStr = b64(salt);
  return crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"])
    .then(function (key) {
      return crypto.subtle.deriveBits({ name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" }, key, 256);
    })
    .then(function (bits) { return { salt: saltStr, hash: b64(bits) }; })
    .catch(function () {
      var h = 5381, i;
      for (i = 0; i < pw.length; i++) h = ((h << 5) + h + pw.charCodeAt(i)) >>> 0;
      return { salt: saltStr, hash: "fb" + h.toString(16) + ":" + pw.length };
    });
}

function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function sanitizeUrl(u) {
  u = u.trim();
  if (/^(https?:|mailto:|#|\/|att:|images\/)/i.test(u)) return u;
  return "#";
}
function inlineMd(s) {
  s = escapeHtml(s);
  s = s.replace(/`([^`\n]+)`/g, function (m, c) { return "<code>" + c + "</code>"; });
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+&quot;[^&]*&quot;)?\)/g, function (m, alt, src) {
    return '<img alt="' + alt + '" data-src="' + escapeHtml(sanitizeUrl(src.replace(/&amp;/g, "&"))) + '" loading="lazy">';
  });
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+&quot;[^&]*&quot;)?\)/g, function (m, t, u) {
    var safe = sanitizeUrl(u.replace(/&amp;/g, "&"));
    var ext = /^https?:/i.test(safe) ? ' target="_blank" rel="noopener"' : "";
    return '<a href="' + escapeHtml(safe) + '"' + ext + ">" + t + "</a>";

  s = s.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*\w])\*([^*\n]+)\*(?=[^*\w]|$)/g, "$1<em>$2</em>");
  s = s.replace(/~~([^~\n]+)~~/g, "<del>$1</del>");
  return s;
}
function splitRow(line) {
  return line.trim().replace(/^\||\|$/g, "").split("|").map(function (c) { return c.trim(); });
}
function renderListBlock(items) {
  var html = "", stack = [];
  items.forEach(function (it) {
    var depth = Math.min(1, Math.floor(it.indent / 2));
    var top = stack[stack.length - 1];
    if (!top) { html += "<" + it.type + ">"; stack.push({ type: it.type, depth: 0 }); html += "<li>"; }
    else if (depth > top.depth && top.depth === 0 && depth === 1) { html += "<" + it.type + ">"; stack.push({ type: it.type, depth: 1 }); html += "<li>"; }
    else {
      while (stack.length && depth < stack[stack.length - 1].depth) html += "</li></" + stack.pop().type + ">";
      if (stack.length && stack[stack.length - 1].type === it.type) html += "</li><li>";
      else { if (stack.length) html += "</li></" + stack.pop().type + ">"; html += "<" + it.type + "><li>"; stack.push({ type: it.type, depth: depth }); }
    }
    html += inlineMd(it.content);
  });
  while (stack.length) html += "</li></" + stack.pop().type + ">";
  return html;
}
function renderMarkdown(md) {
  var codeBlocks = [];
  md = String(md || "").replace(/\r\n/g, "\n").replace(/```(\w*)\n([\s\S]*?)```/g, function (m, lang, code) {
    codeBlocks.push({ lang: lang, code: code.replace(/\n$/, "") });
    return "\u0000CODE" + (codeBlocks.length - 1) + "\u0000";
  });
  var lines = md.split("\n"), html = "", i = 0, listItems = null, rawMode = null;
  function flushList() { if (listItems) { html += renderListBlock(listItems); listItems = null; } }
  while (i < lines.length) {
    var line = lines[i], t = line.trim();
    if (rawMode) {
      rawMode.buf.push(line);
      var opens = (line.match(new RegExp("<" + rawMode.tag + "\\b", "g")) || []).length;
      var closes = (line.match(new RegExp("</" + rawMode.tag + ">", "g")) || []).length;
      rawMode.depth += opens - closes;
      if (rawMode.depth <= 0) { html += rawMode.buf.join("\n"); rawMode = null; }
      i++; continue;
    }
    var rawMatch = t.match(/^<(div|section|details|figure)\b/);
    if (rawMatch) {
      flushList();
      var rtag = rawMatch[1];
      rawMode = { tag: rtag, depth: 0, buf: [line] };
      var o2 = (line.match(new RegExp("<" + rtag + "\\b", "g")) || []).length;
      var c2 = (line.match(new RegExp("</" + rtag + ">", "g")) || []).length;
      rawMode.depth += o2 - c2;
      if (rawMode.depth <= 0) { html += rawMode.buf.join("\n"); rawMode = null; }
      i++; continue;
    }
    if (/^\u0000CODE\d+\u0000$/.test(t)) {
      flushList();
      var idx = +t.slice(5, -1), cb = codeBlocks[idx];
      html += "<pre><code" + (cb.lang ? ' class="lang-' + escapeHtml(cb.lang) + '"' : "") + ">" + escapeHtml(cb.code) + "</code></pre>";
      i++; continue;
    }
    if (!t) { flushList(); i++; continue; }
    if (/^(-{3,}|\*{3,}|_{3,})$/.test(t)) { flushList(); html += "<hr>"; i++; continue; }
    var h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { flushList(); html += "<h" + h[1].length + ">" + inlineMd(h[2]) + "</h" + h[1].length + ">"; i++; continue; }
    if (/^>\s?/.test(line)) {
      flushList();
      var quote = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) { quote.push(lines[i].replace(/^>\s?/, "")); i++; }
      html += "<blockquote>" + renderMarkdown(quote.join("\n")) + "</blockquote>";
      continue;
    }
    if (/^\|.*\|$/.test(t) && i + 1 < lines.length && /^\|[\s:\-|]+\|$/.test(lines[i + 1].trim())) {
      flushList();
      var header = splitRow(line), rows = [];
      i += 2;
      while (i < lines.length && /^\|.*\|$/.test(lines[i].trim())) { rows.push(splitRow(lines[i])); i++; }
      html += "<table><thead><tr>" + header.map(function (c) { return "<th>" + inlineMd(c) + "</th>"; }).join("") + "</tr></thead><tbody>" +
        rows.map(function (r) { return "<tr>" + r.map(function (c) { return "<td>" + inlineMd(c) + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody></table>";
      continue;
    }
    var ulm = line.match(/^(\s*)[-*+]\s+(.*)$/), olm = line.match(/^(\s*)\d+[.)]\s+(.*)$/);
    if (ulm || olm) {
      if (!listItems) listItems = [];

    }

    var para = [line]; i++;
    while (i < lines.length && lines[i].trim() &&
      !/^(#{1,6}\s|>|```|\||(\s*[-*+]\s)|(\s*\d+[.)]\s)|\u0000CODE)/.test(lines[i])) { para.push(lines[i]); i++; }
    html += "<p>" + inlineMd(para.join("\n")).replace(/\n/g, "<br>") + "</p>";
  }

async function seedIfEmpty() {
  var c = await dbCount("posts");
  if (c > 0) return;
  for (var i = 0; i < SEED_V2_POSTS.length; i++) {
    var p = SEED_V2_POSTS[i];
    await dbPut("posts", {
      title: p.title, content: p.content, tags: p.tags, cover: p.cover, pin: !!p.pin,
      status: "published", views: p.views, createdAt: p.createdAt, updatedAt: p.updatedAt, author: "博主"
    });
  }
  var about = await dbGet("meta", "about");
  if (!about) await dbPut("meta", { k: "about", v: ABOUT_V2 });
}

/* 老用户数据升级：补新文章 + 升级关于页（不动已有数据） */
async function upgradeToV2() {
  var v = await dbGet("meta", "seed_version");
  if (v && v.v >= 2) return;
  var posts = await dbAll("posts");
  var hasToolbox = posts.some(function (p) { return p.title.indexOf("工具箱") >= 0; });
  if (!hasToolbox) {
    var p = SEED_V2_POSTS[0];
    await dbPut("posts", {
      title: p.title, content: p.content, tags: p.tags, cover: p.cover, pin: true,
      status: "published", views: 0, createdAt: p.createdAt, updatedAt: p.updatedAt, author: "博主"
    });
  }
  /* 关于页仅在用户未编辑过时升级 */
  var edited = await dbGet("meta", "about_edited");
  if (!edited) await dbPut("meta", { k: "about", v: ABOUT_V2 });
  /* 老文章补封面（仅当没有封面时） */
  var coverMap = {
    "8400": "images/cover-routing.jpg",
    "3 小时": "images/cover-shortfilm.jpg",
    "Codex": "images/cover-migration.jpg"
  };
  for (var i = 0; i < posts.length; i++) {
    if (posts[i].cover) continue;
    for (var key in coverMap) {
      if (posts[i].title.indexOf(key) >= 0) {
        posts[i].cover = coverMap[key];
        await dbPut("posts", posts[i]);
        break;
      }
    }
  }
  await dbPut("meta", { k: "seed_version", v: 2 });
}

function revealScan() {
  var els = app.querySelectorAll("[data-reveal]:not(.in)");
  var io = null;
  if ("IntersectionObserver" in window) {
    io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) {
          var el = en.target;
          setTimeout(function () { el.classList.add("in"); }, parseInt(el.getAttribute("data-reveal") || "0", 10));
          io.unobserve(el);
        }
      });
    }, { threshold: 0.06, rootMargin: "0px 0px -20px 0px" });
  }
  var vh = window.innerHeight;
  els.forEach(function (el) {
    var rect = el.getBoundingClientRect();
    var delay = parseInt(el.getAttribute("data-reveal") || "0", 10);
    if (rect.top < vh - 40) {
      setTimeout(function () { el.classList.add("in"); }, delay);   /* 首屏内：立即显示 */
    } else if (io) {
      io.observe(el);                                              /* 下方：滚动渐显 */
    } else {
      el.classList.add("in");
    }
  });
}

    await dbPut("posts", p);
  }
  var all = (await dbAll("posts")).filter(function (x) { return x.status === "published"; });
  all.sort(function (a, b) { return b.createdAt - a.createdAt; });
  var idx = all.findIndex(function (x) { return x.id === p.id; });
  var prev = idx > 0 ? all[idx - 1] : null, next = idx < all.length - 1 ? all[idx + 1] : null;
  var related = all.filter(function (x) {
    return x.id !== p.id && (x.tags || []).some(function (t) { return (p.tags || []).indexOf(t) >= 0; });
  }).slice(0, 2);

  var h = '<a class="back-link" href="#/">← 返回列表</a><div class="article-layout"><article class="article">' +
    '<div class="article-head"><div class="post-meta"><span>' + fmtDate(p.createdAt) + '</span><span class="dot"></span><span>' + readMinutes(p.content) + ' 分钟阅读</span><span class="dot"></span><span>' + (p.views || 0) + ' 次阅读</span></div>' +
    "<h1>" + esc(p.title) + "</h1></div>";
  if (p.cover) h += '<img class="article-cover" src="' + esc(p.cover) + '" alt="' + esc(p.title) + '" loading="lazy">';
  h += '<div class="md" id="mdBody">' + renderMarkdown(p.content) + "</div>";
  if (p.tags && p.tags.length) {
    h += '<div class="article-foot"><div class="tag-row">' + p.tags.map(function (t) {
      return '<a class="chip" href="#/tag/' + encodeURIComponent(t) + '">' + esc(t) + "</a>";
    }).join("") + "</div></div>";
  }
  h += "</article>";
  h += '<aside class="toc" id="tocBox"><div class="toc-title">目录</div><nav id="tocNav"></nav></aside>';
  h += "</div>";
  if (prev || next) {
    h += '<div class="post-nav">' +
      (prev ? '<a href="#/post/' + prev.id + '"><div class="dir">← 上一篇</div><h4>' + esc(prev.title) + "</h4></a>" : "<span></span>") +
      (next ? '<a class="next" href="#/post/' + next.id + '"><div class="dir">下一篇 →</div><h4>' + esc(next.title) + "</h4></a>" : "<span></span>") +
      "</div>";
  }
  if (related.length) {
    h += '<div class="related"><div class="section-head" style="margin:0 0 18px"><div><div class="kicker">RELATED</div><h2 style="font-size:21px">相关阅读</h2></div></div><div class="related-grid">' +
      related.map(function (r) {
        return '<a href="#/post/' + r.id + '">' + (r.cover ? '<div class="r-thumb"><img src="' + esc(r.cover) + '" alt="" loading="lazy"></div>' : "") +
          "<h4>" + esc(r.title) + "</h4></a>";
      }).join("") + "</div></div>";
  }
  app.innerHTML = h;
  app.classList.add("page-enter");
  setTimeout(function () { app.classList.remove("page-enter"); }, 600);
  await hydrateImages(app);
  buildToc();
  revealScan();
}

function buildToc() {
  var nav = document.getElementById("tocNav");
  var body = document.getElementById("mdBody");
  if (!nav || !body) return;
  var heads = body.querySelectorAll("h2, h3");
  if (!heads.length) { document.getElementById("tocBox").style.display = "none"; return; }
  var html = "";
  heads.forEach(function (hd, i) {
    var id = "toc-" + i;
    hd.id = id;
    html += '<a href="#' + id + '" class="' + (hd.tagName === "H3" ? "lv3" : "") + '">' + hd.textContent + "</a>";
  });
  nav.innerHTML = html;
  var links = nav.querySelectorAll("a");
  function onScroll() {
    var cur = 0;
    for (var i = 0; i < heads.length; i++) {
      if (heads[i].getBoundingClientRect().top < 120) cur = i;
    }
    links.forEach(function (a, i) { a.classList.toggle("active", i === cur); });
  }
  window.addEventListener("scroll", onScroll, { passive: true });
  onScroll();
}

async function viewEdit(id) {
  if (!state.user || state.user.role !== "author") { location.hash = "#/login"; return; }
  var isNew = !id, p = { title: "", tags: [], content: "", cover: null, pin: false };
  if (!isNew) {
    p = await dbGet("posts", +id);
    if (!p) { toast("文章不存在"); location.hash = "#/admin"; return; }
  }
  app.innerHTML = editorWrap({
    isNew: isNew, title: p.title, tags: (p.tags || []).join(", "),
    content: p.content, cover: p.cover, pin: !!p.pin
  });
  var ta = document.getElementById("fContent");
  var preview = document.getElementById("previewMd");
  var coverVal = p.cover;
  function refreshPreview() {
    preview.innerHTML = renderMarkdown(ta.value);
    hydrateImages(preview);
  }
  ta.addEventListener("input", refreshPreview);
  refreshPreview();
  app.querySelectorAll("[data-md]").forEach(function (btn) {
    btn.onclick = async function () {
      var kind = btn.getAttribute("data-md"), s = ta.selectionStart, e = ta.selectionEnd, sel = ta.value.slice(s, e), rep = sel;
      if (kind === "preview") { refreshPreview(); toast("已刷新预览"); return; }
      if (kind === "h2") rep = "## " + sel;
      else if (kind === "h3") rep = "### " + sel;
      else if (kind === "bold") rep = "**" + sel + "**";
      else if (kind === "italic") rep = "*" + sel + "*";
      else if (kind === "code") rep = "`" + sel + "`";
      else if (kind === "link") rep = "[" + (sel || "链接文字") + "](https://)";
      else if (kind === "quote") rep = "> " + sel;
      else if (kind === "ul") rep = "- " + sel;
      else if (kind === "ol") rep = "1. " + sel;
      else if (kind === "hr") rep = "\n---\n";
      else if (kind === "table") rep = "\n| 列一 | 列二 |\n|---|---|\n| 内容 | 内容 |\n";
      else if (kind === "codeblock") rep = "```\n" + sel + "\n```";
      else if (kind === "img") {
        var input = document.createElement("input");
        input.type = "file"; input.accept = "image/*";
        input.onchange = async function () {
          if (!input.files[0]) return;
          toast("上传中…");
          try {
            var aid = await uploadFile(input.files[0]);
            var insert = "![" + input.files[0].name + "](att:" + aid + ")";
            var pos = ta.selectionStart;
            ta.value = ta.value.slice(0, pos) + insert + ta.value.slice(ta.selectionEnd);
            ta.selectionStart = ta.selectionEnd = pos + insert.length;
            ta.focus(); refreshPreview(); toast("图片已插入");
          } catch (ex) { toast("上传失败：" + ex.message); }
        };
        input.click();
        return;
      }
      ta.value = ta.value.slice(0, s) + rep + ta.value.slice(e);
      var caret = s + rep.length;
      ta.selectionStart = ta.selectionEnd = caret;
      ta.focus(); refreshPreview();
    };
  });
  var coverBtn = document.getElementById("btnCover");
  if (coverBtn) {
    coverBtn.onclick = function () {
      var input = document.createElement("input");
      input.type = "file"; input.accept = "image/*";
      input.onchange = async function () {
        if (!input.files[0]) return;
        toast("上传中…");
        try {
          coverVal = "att:" + await uploadFile(input.files[0]);
          var thumb = document.getElementById("coverThumb");
          thumb.style.display = "block";
          var att = await dbGet("attachments", coverVal.slice(4));
          thumb.src = URL.createObjectURL(att.blob);
          toast("封面已设置");
        } catch (ex) { toast("上传失败：" + ex.message); }
      };
      input.click();
    };
  }
  var coverDel = document.getElementById("btnCoverDel");
  if (coverDel) coverDel.onclick = function () { coverVal = null; document.getElementById("coverThumb").style.display = "none"; toast("已移除封面"); };
  document.getElementById("postForm").onsubmit = async function (e) {
    e.preventDefault();
    var status = e.submitter ? e.submitter.getAttribute("data-save") : "published";
    var title = document.getElementById("fTitle").value.trim();
    var content = ta.value;
    if (!title) { toast("标题不能为空"); return; }
    if (!plainText(content)) { toast("正文不能为空"); return; }
    var tags = document.getElementById("fTags").value.split(/[,，]/).map(function (t) { return t.trim(); }).filter(Boolean);
    var pin = document.getElementById("fPin").checked;
    var now = Date.now();
    var record = {
      id: isNew ? undefined : p.id, title: title, content: content, tags: tags,
      cover: coverVal, pin: pin, status: status, views: isNew ? 0 : (p.views || 0),
      createdAt: isNew ? now : p.createdAt, updatedAt: now, author: state.user.nickname
    };
    await dbPut("posts", record);
    toast(status === "published" ? "已发布" : "已存为草稿");
    location.hash = "#/admin"; render();
  };
}
async function viewEditAbout() {
  if (!state.user || state.user.role !== "author") { location.hash = "#/login"; return; }
  var meta = await dbGet("meta", "about");
  var content = (meta && meta.v) || ABOUT_V2;
  app.innerHTML = '<div class="admin-head"><div><h1>编辑关于页</h1><div class="sub">支持 Markdown 与内置时间线</div></div>' +
    '<a class="btn btn-ghost btn-sm" href="#/about">← 查看效果</a></div>' +
    '<div class="editor"><form id="aboutForm"><div class="field"><label>内容（Markdown）</label>' +
    '<div class="editor-split"><textarea id="fAbout">' + esc(content) + '</textarea>' +
    '<div class="editor-preview"><div class="md" id="aboutPreview"></div></div></div></div>' +
    '<div class="editor-actions"><button class="btn btn-dark" type="submit">保存</button>' +
    '<a class="btn btn-ghost" href="#/about">取消</a></div></form></div>';
  var ta = document.getElementById("fAbout"), preview = document.getElementById("aboutPreview");
  function refresh() { preview.innerHTML = renderMarkdown(ta.value); hydrateImages(preview); }
  ta.addEventListener("input", refresh); refresh();
  document.getElementById("aboutForm").onsubmit = async function (e) {
    e.preventDefault();
    await dbPut("meta", { k: "about", v: ta.value });
    await dbPut("meta", { k: "about_edited", v: 1 });
    toast("关于页已保存"); location.hash = "#/about"; render();
  };
}

/* ---------- 附件上传 ---------- */
async function uploadFile(file) {
  if (file.size > 8 * 1024 * 1024) throw new Error("文件超过 8MB 限制");
  if (!/^image\//.test(file.type)) throw new Error("仅支持图片文件");
  var id = uid();
  await dbPut("attachments", { id: id, blob: file, name: file.name, type: file.type, size: file.size, createdAt: Date.now() });
  return id;
}

/* ============================================================
 * 8. 路由
 * ============================================================ */
async function render() {
  document.getElementById("navLinks").innerHTML = navHtml();
  bindNav();
  var hash = location.hash || "#/";
  try {
    if (hash === "#/" || hash === "#" || hash === "") await viewList();
    else if (/^#\/post\/\d+$/.test(hash)) await viewPost(hash.split("/")[2]);
    else if (hash === "#/tags") await viewTags();
    else if (/^#\/tag\//.test(hash)) await viewTag(hash.slice(6));
    else if (hash === "#/about") await viewAbout();
    else if (hash === "#/login") viewLogin();
    else if (hash === "#/register") viewRegister();
    else if (hash === "#/admin") await viewAdmin();
    else if (/^#\/edit\/\d+$/.test(hash)) await viewEdit(hash.split("/")[2]);
    else if (hash === "#/edit") await viewEdit(null);
    else if (hash === "#/edit-about") await viewEditAbout();
    else {
      app.innerHTML = '<div class="empty" style="margin-top:40px" data-reveal="0"><b>404 · 页面不存在</b><a href="#/" style="text-decoration:underline">返回首页</a></div>';
      revealScan();
    }
  } catch (ex) {
    app.innerHTML = '<div class="empty" style="margin-top:40px"><b>页面加载出错</b>' + esc(ex.message) + "</div>";
  }
  window.scrollTo(0, 0);
}

/* ============================================================
 * 9. 启动
 * ============================================================ */
(async function init() {
  applyTheme(currentTheme());
  bindBackTop();
  try {
    await openDB();
    await seedIfEmpty();
    await upgradeToV2();
    state.user = await currentUser();
  } catch (ex) {
    app.innerHTML = '<div class="empty" style="margin-top:40px"><b>本地数据库初始化失败</b>' + esc(ex.message) + "（请使用 Chrome/Edge 的普通窗口打开，不要用隐私模式）</div>";
    return;
  }
  window.addEventListener("hashchange", render);
  if (!location.hash) location.hash = "#/";
  await render();
})();
</script>
