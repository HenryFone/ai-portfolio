<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目中心 — Project Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============ 设计令牌：Zinc + Indigo 单点强调 ============ */
:root{
  --z50:#fafafa;--z100:#f4f4f5;--z200:#e4e4e7;--z300:#d4d4d8;--z400:#a1a1aa;
  --z500:#71717a;--z600:#52525b;--z700:#3f3f46;--z800:#27272a;--z900:#18181b;--z950:#09090b;
  --bg:#ffffff;--sunken:#f7f7f8;--soft:#f1f1f3;--hover:#f4f4f5;--active:#e9e9ec;
  --panel:#ffffff;--side:#f9f9fa;--glass:rgba(255,255,255,.82);
  --fg:#101014;--fg2:#52525b;--fg3:#9b9ba4;--fg4:#c4c4cc;
  --line:#e6e6ea;--line2:#f0f0f2;
  --accent:#4f46e5;--accent-hi:#6366f1;--accent-soft:#eef0ff;--ring:rgba(79,70,229,.14);
  --green:#16a34a;--green-soft:#eefbf2;--amber:#d97706;--amber-soft:#fdf5e6;
  --violet:#7c5cf0;--violet-soft:#f3effe;--red:#dc2626;--red-soft:#fdeeee;--sky:#0284c7;--sky-soft:#e9f5fd;
  --sh1:0 1px 2px rgba(16,16,20,.05);
  --sh2:0 2px 6px rgba(16,16,20,.05),0 8px 24px rgba(16,16,20,.06);
  --sh3:0 4px 12px rgba(16,16,20,.07),0 16px 44px rgba(16,16,20,.10);
  --sh-modal:0 8px 20px rgba(16,16,20,.08),0 28px 72px rgba(16,16,20,.20);
  --r1:6px;--r2:8px;--r3:10px;--r4:12px;--r5:16px;
  --spring:cubic-bezier(.34,1.56,.64,1);--ease:cubic-bezier(.16,1,.3,1);
}
html[data-theme="dark"]{
  --bg:#0b0c0e;--sunken:#0e0f12;--soft:#17181c;--hover:#191a1f;--active:#22242a;
  --panel:#111216;--side:#0c0d10;--glass:rgba(14,15,18,.82);
  --fg:#f4f4f5;--fg2:#a6a7b0;--fg3:#66686f;--fg4:#3c3e45;
  --line:#212329;--line2:#17181c;
  --accent:#6e76f2;--accent-hi:#8b91f7;--accent-soft:#1b1d33;--ring:rgba(110,118,242,.22);
  --green:#3ecf6e;--green-soft:#10231a;--amber:#f0a33a;--amber-soft:#241c0e;
  --violet:#a78bfa;--violet-soft:#1e1a30;--red:#f16a6a;--red-soft:#2a1416;--sky:#4cb8f0;--sky-soft:#0e1f2b;
  --sh1:0 1px 2px rgba(0,0,0,.4);
  --sh2:0 2px 8px rgba(0,0,0,.45),0 10px 28px rgba(0,0,0,.4);
  --sh3:0 6px 16px rgba(0,0,0,.5),0 20px 52px rgba(0,0,0,.5);
  --sh-modal:0 10px 24px rgba(0,0,0,.5),0 32px 80px rgba(0,0,0,.65);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  font-size:13.5px;line-height:1.55;color:var(--fg);background:var(--bg);
  -webkit-font-smoothing:antialiased;overflow:hidden;
  transition:background .3s var(--ease),color .3s var(--ease);
}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
svg{display:block;flex-shrink:0}
::selection{background:var(--accent-soft);color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--fg4);border-radius:8px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--fg3)}

/* ============ 骨架 ============ */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{
  width:248px;min-width:248px;background:var(--side);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:14px 12px 10px;user-select:none;z-index:30;
  transition:background .3s var(--ease),border-color .3s var(--ease);
}
.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;position:relative}

/* 品牌 + 项目切换 */
.proj-switch{
  display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:var(--r2);
  transition:background .15s;text-align:left;
}
.proj-switch:hover{background:var(--hover)}
.proj-logo{
  width:30px;height:30px;border-radius:9px;flex-shrink:0;color:#fff;
  background:linear-gradient(140deg,#5b52ec 0%,#8b7cf6 60%,#b3a5fa 130%);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px var(--ring),inset 0 1px 0 rgba(255,255,255,.28);
}
.proj-logo svg{width:16px;height:16px}
.proj-meta{flex:1;min-width:0}
.proj-name{display:block;font-size:13.5px;font-weight:650;letter-spacing:-.015em;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj-sub{display:block;font-size:10.5px;color:var(--fg3);font-family:'JetBrains Mono',monospace}
.proj-caret{color:var(--fg3);transition:transform .2s var(--spring)}
.proj-switch:hover .proj-caret{color:var(--fg2)}

.nav-label{font-size:10px;font-weight:700;color:var(--fg4);text-transform:uppercase;letter-spacing:.09em;padding:0 10px;margin:18px 0 6px}
.nav-item{
  display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px;border-radius:var(--r1);
  font-size:13px;font-weight:500;letter-spacing:-.008em;color:var(--fg2);text-align:left;
  transition:background .14s,color .14s;
}
.nav-item svg{width:16.5px;height:16.5px;opacity:.8}
.nav-item:hover{background:var(--hover);color:var(--fg)}
.nav-item.active{background:var(--active);color:var(--fg);font-weight:600}
.nav-item.active svg{opacity:1;color:var(--accent)}
.nav-badge{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;color:var(--fg3);background:var(--soft);padding:1px 6px;border-radius:99px}
.nav-item.active .nav-badge{background:var(--accent-soft);color:var(--accent)}
.nav-kbd{margin-left:auto;font-size:10px;color:var(--fg4);font-family:'JetBrains Mono',monospace;display:none}
.nav-item:hover .nav-badge{display:none}
.nav-item:hover .nav-kbd{display:block}

/* 侧栏底部 */
.side-foot{margin-top:auto;border-top:1px solid var(--line2);padding-top:10px}
.theme-row{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-radius:var(--r1)}
.theme-row:hover{background:var(--hover)}
.theme-row-label{font-size:12px;font-weight:500;color:var(--fg2);display:flex;align-items:center;gap:7px}
.theme-row-label svg{width:13px;height:13px;color:var(--fg3)}
.theme-toggle{position:relative;width:40px;height:22px;flex-shrink:0;border-radius:99px;background:var(--soft);transition:background .3s var(--ease),box-shadow .3s}
html[data-theme="dark"] .theme-toggle{background:var(--accent);box-shadow:0 0 12px var(--ring)}
.theme-toggle .knob{
  position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;
  transition:transform .38s var(--spring);
}
html[data-theme="dark"] .theme-toggle .knob{transform:translateX(18px)}
.theme-toggle .ic{position:absolute;top:50%;transform:translateY(-50%);width:12px;height:12px;transition:opacity .3s,color .3s}
.theme-toggle .ic-sun{left:4.5px;color:#f59e0b;opacity:1}
.theme-toggle .ic-moon{right:4.5px;color:#c7d2fe;opacity:.3}
html[data-theme="dark"] .theme-toggle .ic-sun{opacity:.25}
html[data-theme="dark"] .theme-toggle .ic-moon{opacity:1}
.user-btn{display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px;border-radius:var(--r2);text-align:left;transition:background .15s;margin-top:4px}
.user-btn:hover{background:var(--hover)}
.avatar{position:relative;width:30px;height:30px;border-radius:50%;overflow:hidden;flex-shrink:0;background:var(--soft)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar .st{position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;border-radius:50%;background:var(--green);border:2px solid var(--side)}
.u-name{display:block;font-size:12.5px;font-weight:600;line-height:1.25;letter-spacing:-.01em}
.u-role{display:block;font-size:10.5px;color:var(--fg3);line-height:1.3}
.shortcuts{padding:9px 10px 2px;font-size:10px;color:var(--fg4);line-height:1.9}
.shortcuts kbd{font-family:'JetBrains Mono',monospace;font-size:9.5px;background:var(--soft);border:1px solid var(--line2);border-radius:3px;padding:0 4px;color:var(--fg3)}
.spacer{flex:1}

/* ============ 顶栏 ============ */
.topbar{
  height:54px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 24px;
  border-bottom:1px solid var(--line);background:var(--glass);backdrop-filter:blur(12px);
  z-index:25;transition:border-color .3s var(--ease);
}
.crumb{font-size:12px;color:var(--fg3);display:flex;align-items:center;gap:6px;white-space:nowrap}
.crumb b{color:var(--fg);font-weight:550}
.crumb .sep{color:var(--fg4)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.search-btn{
  display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;min-width:210px;
  border:1px solid var(--line);border-radius:var(--r1);background:var(--sunken);
  color:var(--fg3);font-size:12px;transition:all .15s;text-align:left;
}
.search-btn:hover{border-color:var(--z300);background:var(--hover);color:var(--fg2)}
html[data-theme="dark"] .search-btn:hover{border-color:var(--z700)}
.search-btn svg{width:13px;height:13px}
.search-btn .mono{margin-left:auto;font-size:10px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--fg3)}
.icon-btn{
  position:relative;width:30px;height:30px;border-radius:var(--r1);display:flex;align-items:center;justify-content:center;
  color:var(--fg2);transition:background .15s,color .15s,transform .2s var(--spring);
}
.icon-btn:hover{background:var(--hover);color:var(--fg)}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:15.5px;height:15.5px}
.icon-btn .dot{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--red);border:1.5px solid var(--bg)}
.btn{
  display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:var(--r1);
  border:1px solid var(--line);background:var(--panel);font-size:12.5px;font-weight:550;color:var(--fg2);letter-spacing:-.008em;
  transition:transform .28s var(--spring),box-shadow .28s var(--spring),background .15s,border-color .15s,color .15s;
}
.btn svg{width:13.5px;height:13.5px}
.btn:hover{background:var(--hover);color:var(--fg);transform:translateY(-1px);box-shadow:var(--sh2)}
.btn:active{transform:translateY(0) scale(.98)}
.btn-primary{background:var(--accent);border-color:transparent;color:#fff;box-shadow:0 1px 3px var(--ring)}
.btn-primary:hover{background:var(--accent-hi);color:#fff;box-shadow:0 5px 16px var(--ring)}
.btn-danger{background:var(--red-soft);border-color:transparent;color:var(--red)}
.btn-danger:hover{background:var(--red);color:#fff}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:var(--hover);box-shadow:none}
.btn-sm{height:26px;padding:0 9px;font-size:11.5px;border-radius:5px}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-size:11px;font-weight:500;color:var(--fg2);white-space:nowrap}
.chip svg{width:11px;height:11px}
.chip.clickable{cursor:pointer;transition:all .15s}
.chip.clickable:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}

/* ============ 页面容器 ============ */
.page{flex:1;overflow-y:auto;overflow-x:hidden;padding:22px 26px 48px;scroll-behavior:smooth}
.view{animation:viewIn .4s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:flex-end;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.page-title{font-size:21px;font-weight:700;letter-spacing:-.03em;line-height:1.2}
.page-desc{font-size:12px;color:var(--fg3);margin-top:3px}
.page-head-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.stagger>*{animation:itemIn .45s var(--ease) backwards;animation-delay:calc(var(--i,0)*45ms)}
@keyframes itemIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ============ 卡片 / 分区 ============ */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r3);transition:border-color .2s,box-shadow .3s var(--spring),transform .3s var(--spring)}
.card.lift:hover{transform:translateY(-3px);box-shadow:var(--sh3);border-color:var(--z300)}
html[data-theme="dark"] .card.lift:hover{border-color:var(--z700)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.card-title{font-size:14px;font-weight:650;letter-spacing:-.015em}
.card-sub{font-size:11px;color:var(--fg3);margin-top:2px}

/* ============ 仪表盘 ============ */
.hero-grid{display:grid;grid-template-columns:300px 1fr;gap:14px;margin-bottom:14px}
.health-card{padding:20px;display:flex;gap:18px;align-items:center}
.donut-wrap{position:relative;width:96px;height:96px;flex-shrink:0}
.donut-wrap svg{width:96px;height:96px}
.donut-track{stroke:var(--soft)}
.donut-val{transition:stroke-dasharray 1s var(--ease)}
.donut-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut-num b{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:600;letter-spacing:-.03em}
.donut-num span{font-size:9.5px;color:var(--fg3);letter-spacing:.04em}
.health-copy{flex:1;min-width:0}
.health-copy h3{font-size:15px;font-weight:650;letter-spacing:-.02em}
.health-copy p{font-size:12px;color:var(--fg2);margin-top:5px;line-height:1.6}
.health-copy p b{color:var(--fg)}
.health-facts{display:flex;gap:16px;margin-top:12px}
.fact b{display:block;font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:600;letter-spacing:-.02em}
.fact span{font-size:10px;color:var(--fg3)}
.fact b.warn{color:var(--amber)} .fact b.good{color:var(--green)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{padding:15px 16px 13px;position:relative;overflow:hidden}
.stat-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.stat-label{font-size:11.5px;font-weight:550;color:var(--fg3)}
.stat-ic{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center}
.stat-ic svg{width:13.5px;height:13.5px}
.stat-ic.indigo{background:var(--accent-soft);color:var(--accent)}
.stat-ic.amber{background:var(--amber-soft);color:var(--amber)}
.stat-ic.green{background:var(--green-soft);color:var(--green)}
.stat-ic.violet{background:var(--violet-soft);color:var(--violet)}
.stat-value{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:600;letter-spacing:-.04em;line-height:1}
.stat-value .unit{font-size:12px;font-weight:500;color:var(--fg3);letter-spacing:0;margin-left:2px}
.stat-foot{margin-top:8px;display:flex;align-items:center;gap:5px;font-size:11px;color:var(--fg3)}
.trend{display:inline-flex;align-items:center;gap:2px;font-weight:600;font-size:11px}
.trend.up{color:var(--green)} .trend.down{color:var(--red)}
.trend svg{width:10px;height:10px}
.stat-spark{position:absolute;right:12px;bottom:12px;opacity:.9}

.dash-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;margin-top:14px}
.panel{padding:18px 18px 14px}
.chart-wrap{width:100%}
.chart-wrap svg{width:100%;height:auto;display:block}
.chart-x{display:flex;justify-content:space-between;padding:2px 4px 0;font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--fg4)}
.bars{display:flex;flex-direction:column;gap:14px}
.bar-row .bar-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.bar-name{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:550}
.bar-dot{width:7px;height:7px;border-radius:50%}
.bar-num{font-size:12px;color:var(--fg3);font-family:'JetBrains Mono',monospace}
.bar-num b{color:var(--fg)}
.bar-track{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.bar-fill{height:100%;border-radius:3px;width:0;transition:width .7s var(--ease)}

/* 时间线 */
.timeline{display:flex;flex-direction:column}
.tl-item{position:relative;padding:0 0 13px 40px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:'';position:absolute;left:12px;top:28px;bottom:-1px;width:1px;background:var(--line2)}
.tl-item:last-child::before{display:none}
.tl-ava{position:absolute;left:0;top:0;width:26px;height:26px}
.tl-ava img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.tl-text{font-size:12.5px;color:var(--fg2);line-height:1.5}
.tl-text b{color:var(--fg);font-weight:600}
.tl-ref{color:var(--accent);font-weight:600;cursor:pointer}
.tl-ref:hover{text-decoration:underline}
.tl-time{font-size:10.5px;color:var(--fg4);margin-top:2px;font-family:'JetBrains Mono',monospace}

/* 我的今日 */
.today-list{display:flex;flex-direction:column}
.today-item{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid var(--line2);cursor:pointer;border-radius:6px;transition:background .12s}
.today-item:hover{background:var(--hover)}
.today-item:last-child{border-bottom:0}
.tick{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--z300);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;transition:all .2s var(--spring)}
.tick svg{width:10px;height:10px;opacity:0}
.today-item.done .tick{background:var(--green);border-color:var(--green)}
.today-item.done .tick svg{opacity:1}
.today-item.done .t-title{text-decoration:line-through;color:var(--fg3)}
.t-title{flex:1;font-size:12.5px;font-weight:500;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-ava{width:20px;height:20px;border-radius:50%;overflow:hidden;flex-shrink:0}
.t-ava img{width:100%;height:100%;object-fit:cover}

/* ============ 看板 ============ */
.board-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.board-toolbar .grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tb-search{
  display:flex;align-items:center;gap:7px;height:30px;padding:0 10px;min-width:200px;
  border:1px solid var(--line);border-radius:var(--r1);background:var(--panel);transition:border-color .15s,box-shadow .15s;
}
.tb-search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
.tb-search svg{width:13px;height:13px;color:var(--fg3)}
.tb-search input{border:0;outline:0;background:none;width:100%;font-size:12.5px}
.tb-search input::placeholder{color:var(--fg4)}
.board{display:flex;gap:13px;align-items:flex-start}
.col{
  flex:1;min-width:0;background:var(--sunken);border:1px solid var(--line);border-radius:var(--r3);
  display:flex;flex-direction:column;transition:border-color .18s,background .18s,box-shadow .25s var(--spring);
}
.col.drop-target{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px var(--ring)}
.col-head{display:flex;align-items:center;gap:7px;padding:12px 13px 9px}
.col-dot{width:7px;height:7px;border-radius:50%}
.col-name{font-size:12.5px;font-weight:650;letter-spacing:-.01em}
.col-count{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;color:var(--fg3);background:var(--soft);padding:1px 6px;border-radius:99px}
.col-wip{font-size:9.5px;font-weight:700;color:var(--amber);background:var(--amber-soft);padding:1px 6px;border-radius:99px;letter-spacing:.03em}
.col-body{display:flex;flex-direction:column;gap:8px;padding:0 9px 9px;min-height:56px;max-height:calc(100vh - 330px);overflow-y:auto}
.col-add{
  margin:0 9px 9px;width:calc(100% - 18px);padding:7px;border:1px dashed var(--line);border-radius:var(--r2);
  color:var(--fg3);font-size:12px;display:flex;align-items:center;justify-content:center;gap:5px;
  transition:all .16s;
}
.col-add svg{width:12px;height:12px}
.col-add:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.task{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:11px 12px 10px;
  cursor:grab;position:relative;
  transition:transform .3s var(--spring),box-shadow .3s var(--spring),border-color .15s,opacity .2s;
}
.task::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:2.5px;border-radius:0 3px 3px 0;background:var(--prio);opacity:.8}
.task:hover{transform:translateY(-2px);box-shadow:var(--sh2);border-color:var(--z300)}
html[data-theme="dark"] .task:hover{border-color:var(--z700)}
.task:active{cursor:grabbing}
.task.dragging{opacity:.35;transform:scale(.97) rotate(.8deg);box-shadow:none}
.task-title{font-size:12.8px;font-weight:600;letter-spacing:-.012em;line-height:1.42;margin-bottom:8px;padding-left:5px}
.task-id{font-size:10px;color:var(--fg4);font-family:'JetBrains Mono',monospace;float:right;margin-top:1px;padding-left:5px}
.tags{display:flex;gap:4px;flex-wrap:wrap;padding:0 5px;margin-bottom:8px}
.tag{font-size:9.5px;font-weight:600;padding:1.5px 7px;border-radius:99px;letter-spacing:.01em}
.task-foot{display:flex;align-items:center;gap:8px;padding:0 5px}
.prio{font-size:9.5px;font-weight:700;padding:1.5px 7px;border-radius:4px;letter-spacing:.015em}
.prio.high{background:var(--red-soft);color:var(--red)}
.prio.medium{background:var(--amber-soft);color:var(--amber)}
.prio.low{background:var(--soft);color:var(--fg3)}
.task-due{font-size:10px;color:var(--fg3);font-family:'JetBrains Mono',monospace;display:flex;align-items:center;gap:3px}
.task-due svg{width:10px;height:10px}
.task-due.overdue{color:var(--red);font-weight:600}
.task-due.today{color:var(--amber);font-weight:600}
.task-meta-r{margin-left:auto;display:flex;align-items:center;gap:7px}
.mini{display:flex;align-items:center;gap:3px;font-size:10px;color:var(--fg3);font-family:'JetBrains Mono',monospace}
.mini svg{width:11px;height:11px}
.t-ava-sm{width:20px;height:20px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px var(--panel)}
.t-ava-sm img{width:100%;height:100%;object-fit:cover}
.sub-track{width:32px;height:3.5px;border-radius:2px;background:var(--soft);overflow:hidden}
.sub-fill{height:100%;border-radius:2px;background:var(--accent)}
.col-empty{border:1px dashed var(--line);border-radius:var(--r2);padding:18px 10px;text-align:center;font-size:11.5px;color:var(--fg4)}

/* ============ 团队 ============ */
.team-sum{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(296px,1fr));gap:13px}
.member{padding:18px;display:flex;flex-direction:column;gap:13px}
.m-top{display:flex;align-items:center;gap:13px}
.m-ava{position:relative;width:48px;height:48px;border-radius:50%;overflow:hidden;flex-shrink:0;box-shadow:0 0 0 3px var(--panel),0 2px 10px rgba(0,0,0,.12)}
.m-ava img{width:100%;height:100%;object-fit:cover}
.m-ava .st{position:absolute;right:1px;bottom:1px;width:11px;height:11px;border-radius:50%;background:var(--green);border:2.5px solid var(--panel)}
.m-ava .st.away{background:var(--amber)} .m-ava .st.off{background:var(--fg4)}
.m-info{flex:1;min-width:0}
.m-name{font-size:14px;font-weight:650;letter-spacing:-.015em}
.m-role{font-size:11.5px;color:var(--fg3);margin-top:1px}
.m-email{font-size:10.5px;color:var(--fg4);font-family:'JetBrains Mono',monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.m-load-row{display:flex;align-items:center;gap:14px;padding-top:12px;border-top:1px solid var(--line2)}
.m-stats{display:flex;gap:18px}
.m-stat b{display:block;font-family:'JetBrains Mono',monospace;font-size:14.5px;font-weight:600;letter-spacing:-.02em}
.m-stat span{font-size:10px;color:var(--fg3)}
.m-donut{position:relative;width:52px;height:52px;margin-left:auto}
.m-donut svg{width:52px;height:52px}
.m-donut .donut-track{stroke:var(--soft)}
.m-donut .dn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:600}
.skills{display:flex;gap:5px;flex-wrap:wrap}
.skill{font-size:10px;font-weight:550;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--fg2);border:1px solid var(--line2)}
.m-actions{display:flex;gap:7px;align-items:center}

/* ============ 设置 ============ */
.settings-wrap{max-width:760px}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:var(--r3);padding:22px;margin-bottom:14px}
.sec-title{font-size:14.5px;font-weight:650;letter-spacing:-.018em;display:flex;align-items:center;gap:8px}
.sec-title svg{width:15px;height:15px;color:var(--fg3)}
.sec-desc{font-size:12px;color:var(--fg3);margin-top:3px;margin-bottom:18px;line-height:1.6}
.field{margin-bottom:15px}
.f-label{display:block;font-size:12px;font-weight:550;margin-bottom:6px;letter-spacing:-.008em}
.f-hint{font-size:10.5px;color:var(--fg4);margin-top:5px}
.input,.select,.textarea{
  width:100%;padding:7.5px 11px;border:1px solid var(--line);border-radius:var(--r1);
  background:var(--sunken);font-size:12.5px;outline:none;
  transition:border-color .16s,box-shadow .16s,background .16s;
}
.textarea{resize:vertical;min-height:76px;line-height:1.6}
.select{appearance:none;cursor:pointer;padding-right:30px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='11' height='11' viewBox='0 0 24 24' fill='none' stroke='%23a1a1aa' stroke-width='2.6' stroke-linecap='round'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center}
.input:focus,.select:focus,.textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring);background:var(--panel)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.form-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.switch-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line2)}
.switch-row:last-child{border-bottom:0}
.sw-copy{flex:1;min-width:0}
.sw-name{font-size:12.5px;font-weight:550}
.sw-note{font-size:11px;color:var(--fg3);margin-top:2px;line-height:1.5}
.switch{position:relative;width:36px;height:20px;flex-shrink:0;border-radius:99px;background:var(--soft);transition:background .26s var(--ease)}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.22);transition:transform .32s var(--spring)}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(16px)}
.sec.danger{border-color:#f3c6c6}
html[data-theme="dark"] .sec.danger{border-color:#4a2024}
.danger-title svg{color:var(--red)}
.dz{margin-top:14px;padding:13px 14px;border-radius:var(--r2);background:var(--red-soft);border:1px solid #f3c6c6;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
html[data-theme="dark"] .dz{border-color:#4a2024}
.dz-copy{flex:1;min-width:200px}
.dz-copy b{display:block;font-size:12.5px;font-weight:650;color:var(--red)}
.dz-copy span{font-size:11px;color:var(--fg2);opacity:.8;line-height:1.5}

/* ============ 抽屉 ============ */
.scrim{position:fixed;inset:0;background:rgba(10,10,14,.42);backdrop-filter:blur(2px);z-index:90;opacity:0;visibility:hidden;transition:opacity .25s var(--ease),visibility .25s}
.scrim.show{opacity:1;visibility:visible}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(480px,94vw);z-index:95;
  background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--sh-modal);
  transform:translateX(105%);transition:transform .42s var(--ease);
  display:flex;flex-direction:column;
}
.drawer.show{transform:none}
.drawer-head{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.drawer-body{flex:1;overflow-y:auto;padding:18px}
.d-title{font-size:16px;font-weight:700;letter-spacing:-.02em;line-height:1.4;margin-bottom:4px}
.d-id{font-size:11px;color:var(--fg4);font-family:'JetBrains Mono',monospace}
.d-sec{margin-top:20px}
.d-sec-label{font-size:10.5px;font-weight:700;color:var(--fg4);text-transform:uppercase;letter-spacing:.08em;margin-bottom:9px}
.d-desc{font-size:12.5px;color:var(--fg2);line-height:1.7}
.d-props{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.prop-label{font-size:10.5px;color:var(--fg3);margin-bottom:4px;font-weight:550}
.subtask{display:flex;align-items:center;gap:9px;padding:7px 9px;border:1px solid var(--line2);border-radius:var(--r1);margin-bottom:6px;cursor:pointer;transition:background .12s}
.subtask:hover{background:var(--hover)}
.subtask .tick{width:15px;height:15px;border-radius:4.5px}
.subtask.done .tick{background:var(--accent);border-color:var(--accent)}
.subtask.done .tick svg{opacity:1}
.subtask span:last-child{font-size:12.5px;flex:1}
.subtask.done span:last-child{color:var(--fg3);text-decoration:line-through}
.comment{display:flex;gap:10px;margin-bottom:14px}
.c-ava{width:26px;height:26px;border-radius:50%;overflow:hidden;flex-shrink:0}
.c-ava img{width:100%;height:100%;object-fit:cover}
.c-head{display:flex;align-items:baseline;gap:7px}
.c-name{font-size:12px;font-weight:650}
.c-time{font-size:10px;color:var(--fg4);font-family:'JetBrains Mono',monospace}
.c-text{font-size:12.5px;color:var(--fg2);line-height:1.6;margin-top:2px}
.c-input{display:flex;gap:9px;margin-top:4px}
.c-input .input{flex:1}
.drawer-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--line2)}

/* ============ 命令面板 ============ */
.ovl{position:fixed;inset:0;z-index:120;background:rgba(9,9,12,.44);backdrop-filter:blur(5px);display:flex;align-items:flex-start;justify-content:center;padding:12vh 20px 20px;opacity:0;visibility:hidden;transition:opacity .2s var(--ease),visibility .2s}
.ovl.show{opacity:1;visibility:visible}
.palette{
  width:100%;max-width:560px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r4);
  box-shadow:var(--sh-modal);overflow:hidden;transform:translateY(-10px) scale(.98);transition:transform .3s var(--spring);
}
.ovl.show .palette{transform:none}
.pal-search{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line2)}
.pal-search svg{width:15px;height:15px;color:var(--fg3)}
.pal-search input{flex:1;border:0;outline:0;background:none;font-size:14.5px}
.pal-search input::placeholder{color:var(--fg4)}
.pal-search kbd{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--fg3);background:var(--soft);border:1px solid var(--line2);border-radius:4px;padding:2px 6px}
.pal-list{max-height:320px;overflow-y:auto;padding:7px}
.pal-group{font-size:10px;font-weight:700;color:var(--fg4);text-transform:uppercase;letter-spacing:.08em;padding:8px 10px 4px}
.pal-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:var(--r1);font-size:13px;text-align:left;color:var(--fg2)}
.pal-item svg{width:14px;height:14px;color:var(--fg3)}
.pal-item.sel{background:var(--accent-soft);color:var(--accent)}
.pal-item.sel svg{color:var(--accent)}
.pal-item .sub{margin-left:auto;font-size:10.5px;color:var(--fg4);font-family:'JetBrains Mono',monospace}
.pal-item img{width:18px;height:18px;border-radius:50%;object-fit:cover}
.pal-empty{padding:26px;text-align:center;color:var(--fg4);font-size:12.5px}
.pal-foot{display:flex;gap:14px;padding:9px 14px;border-top:1px solid var(--line2);font-size:10.5px;color:var(--fg4)}
.pal-foot kbd{font-family:'JetBrains Mono',monospace;font-size:9.5px;background:var(--soft);border:1px solid var(--line2);border-radius:3px;padding:0 4px;margin-right:3px}

/* ============ 弹窗 ============ */
.modal-ovl{position:fixed;inset:0;z-index:110;background:rgba(9,9,12,.44);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;visibility:hidden;transition:opacity .22s var(--ease),visibility .22s}
.modal-ovl.show{opacity:1;visibility:visible}
.modal{
  width:100%;max-width:460px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r4);
  padding:22px;box-shadow:var(--sh-modal);transform:translateY(14px) scale(.97);transition:transform .34s var(--spring);
  max-height:calc(100vh - 48px);overflow-y:auto;
}
.modal-ovl.show .modal{transform:none}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:18px}
.modal-title{font-size:15.5px;font-weight:700;letter-spacing:-.02em}
.modal-sub{font-size:11.5px;color:var(--fg3);margin-top:2px}
.modal-x{width:26px;height:26px;border-radius:var(--r1);display:flex;align-items:center;justify-content:center;color:var(--fg3);transition:background .14s,color .14s}
.modal-x:hover{background:var(--hover);color:var(--fg)}
.modal-x svg{width:14px;height:14px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.prio-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.prio-opt{padding:8px 6px;border:1px solid var(--line);border-radius:var(--r1);background:var(--sunken);text-align:center;font-size:12px;font-weight:500;color:var(--fg2);display:flex;align-items:center;justify-content:center;gap:5px;transition:all .15s}
.prio-opt .d{width:6px;height:6px;border-radius:50%}
.prio-opt:hover{border-color:var(--accent)}
.prio-opt.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:650}

/* ============ Toast ============ */
.toasts{position:fixed;top:16px;right:16px;z-index:300;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{
  display:flex;align-items:flex-start;gap:10px;min-width:264px;max-width:360px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:11px 13px;
  box-shadow:var(--sh3);pointer-events:auto;position:relative;overflow:hidden;
  transform:translateX(30px) scale(.96);opacity:0;transition:transform .4s var(--spring),opacity .2s;
}
.toast.show{transform:none;opacity:1}
.toast.hide{transform:translateX(24px);opacity:0}
.toast .ti{width:19px;height:19px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;margin-top:1px}
.toast .ti svg{width:10.5px;height:10.5px}
.toast.ok .ti{background:var(--green)} .toast.info .ti{background:var(--accent)}
.toast.warn .ti{background:var(--amber)} .toast.err .ti{background:var(--red)}
.toast b{font-weight:650;font-size:12.5px;display:block;letter-spacing:-.01em}
.toast span{font-size:11.5px;color:var(--fg2);display:block;margin-top:1px;line-height:1.45}
.toast .bar{position:absolute;left:0;bottom:0;height:2px;background:var(--accent);opacity:.5;animation:tbar 3.4s linear forwards}
@keyframes tbar{from{width:100%}to{width:0}}

/* 空状态 */
.empty{display:flex;flex-direction:column;align-items:center;padding:40px 20px;color:var(--fg4);text-align:center}
.empty b{font-size:13px;color:var(--fg3);font-weight:600}
.empty span{font-size:11.5px;margin-top:3px}

/* 通知面板 */
.notif-panel{
  position:absolute;top:50px;right:24px;width:320px;z-index:60;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r3);box-shadow:var(--sh3);
  opacity:0;visibility:hidden;transform:translateY(-6px) scale(.98);transform-origin:top right;
  transition:all .25s var(--spring);overflow:hidden;
}
.notif-panel.show{opacity:1;visibility:visible;transform:none}
.np-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line2)}
.np-head b{font-size:13px;font-weight:650}
.np-list{max-height:300px;overflow-y:auto}
.np-item{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line2);transition:background .12s}
.np-item:hover{background:var(--hover)}
.np-item:last-child{border-bottom:0}
.np-item img{width:26px;height:26px;border-radius:50%;object-fit:cover;flex-shrink:0;margin-top:1px}
.np-text{font-size:12px;color:var(--fg2);line-height:1.5}
.np-text b{color:var(--fg);font-weight:600}
.np-time{font-size:10px;color:var(--fg4);margin-top:2px;font-family:'JetBrains Mono',monospace}
.np-item.unread{background:var(--accent-soft)}
html[data-theme="dark"] .np-item.unread{background:rgba(110,118,242,.08)}

/* ============ 响应式 ============ */
@media (max-width:1280px){.hero-grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
@media (max-width:1024px){.dash-grid{grid-template-columns:1fr}}
@media (max-width:768px){
  .app{flex-direction:column}
  .sidebar{width:100%;min-width:0;flex-direction:row;align-items:center;gap:4px;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .proj-switch{width:auto;padding:4px 6px}
  .proj-sub{display:none}
  .nav-label,.shortcuts,.theme-row-label,.u-role-wrap,.spacer{display:none}
  .nav-item{width:auto;white-space:nowrap}
  .nav-kbd,.nav-badge{display:none!important}
  .side-foot{margin-top:0;border-top:0;padding-top:0;margin-left:auto;display:flex;align-items:center;gap:2px}
  .user-btn{width:auto;padding:4px}
  .topbar{padding:0 14px;height:50px}
  .search-btn{min-width:0;padding:0 9px}
  .search-btn .sb-text,.search-btn .mono{display:none}
  .page{padding:16px 14px 36px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .board{flex-direction:column}
  .col-body{max-height:none}
  .grid-2{grid-template-columns:1fr}
  .toasts{top:10px;right:10px;left:10px}
  .toast{max-width:none}
  .notif-panel{right:10px;left:10px;width:auto}
}
@media (max-width:560px){.stats{grid-template-columns:1fr}.page-title{font-size:18px}.d-props{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">

  <!-- ===== 侧边栏 ===== -->
  <aside class="sidebar">
    <button class="proj-switch" id="projSwitch">
      <span class="proj-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h5l3 10h7"/><path d="M3 17h5l2-6"/></svg></span>
      <span class="proj-meta">
        <span class="proj-name" id="brandName">项目中心</span>
        <span class="proj-sub">PH-2026 · 6 名成员</span>
      </span>
      <svg class="proj-caret" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
    </button>

    <div class="nav-label">工作区</div>
    <button class="nav-item active" data-page="dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.6"/></svg>
      仪表盘<span class="nav-kbd">⌘1</span>

<div class="modal-ovl" id="taskOvl" role="dialog" aria-modal="true" aria-labelledby="taskMTitle">

      <button class="modal-x" data-close="task"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <form id="taskForm">
      <div class="field">
        <label class="f-label" for="fTitle">任务标题</label>
        <input class="input" id="fTitle" placeholder="例如：重构登录页表单校验" required maxlength="60">
      </div>
      <div class="field">
        <label class="f-label">优先级</label>
        <div class="prio-pick" id="prioPick">
          <button type="button" class="prio-opt on" data-prio="high"><span class="d" style="background:var(--red)"></span>高</button>
          <button type="button" class="prio-opt" data-prio="medium"><span class="d" style="background:var(--amber)"></span>中</button>
          <button type="button" class="prio-opt" data-prio="low"><span class="d" style="background:var(--z400)"></span>低</button>
        </div>
      </div>
      <div class="grid-2">
        <div class="field"><label class="f-label" for="fWho">负责人</label><select class="select" id="fWho"></select></div>
        <div class="field"><label class="f-label" for="fStatus">初始状态</label>
          <select class="select" id="fStatus">
            <option value="todo">待办</option><option value="progress">进行中</option>
            <option value="review">审阅中</option><option value="done">已完成</option>
          </select>
        </div>
      </div>
      <div class="field"><label class="f-label" for="fDue">截止日期</label><input class="input mono" id="fDue" type="date"><div class="f-hint">留空表示暂不设置截止时间</div></div>
      <div class="modal-foot">
        <button type="button" class="btn" data-close="task">取消</button>
        <button type="submit" class="btn btn-primary">创建任务</button>
      </div>
    </form>
  </div>
</div>

const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const M = id => MEMBERS.find(m=>m.id===id)||MEMBERS[0];
const byStatus = s => tasks.filter(t=>t.status===s);
const pct = (a,b)=> b? Math.round(a/b*100):0;
const ava = (id,cls)=>'<span class="'+cls+'"><img src="'+AV[id]+'" alt="" loading="lazy"></span>';
const today = (()=>{const d=new Date();d.setHours(0,0,0,0);return d})();
function dueInfo(d){
  if(!d) return null;
  const t = new Date(d+'T00:00:00');
  const diff = Math.round((t-today)/86400000);
  return {text:d.slice(5).replace('-','/'), over:diff<0, isToday:diff===0};
}
function ago(min){
  if(min<1) return '刚刚';
  if(min<60) return Math.round(min)+' 分钟前';
  if(min<1440) return Math.round(min/60)+' 小时前';
  return Math.round(min/1440)+' 天前';
}

function toast(title, desc='', kind='ok'){
  const icons = {
    ok:'<path d="M20 6 9 17l-5-5"/>',
    info:'<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/>',
    warn:'<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
    err:'<path d="M18 6 6 18M6 6l12 12"/>'
  };
  const el = document.createElement('div');
  el.className = 'toast '+kind;
  el.innerHTML = '<span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">'+icons[kind]+'</svg></span>'
    + '<div style="flex:1;min-width:0"><b>'+title+'</b>'+(desc?'<span>'+desc+'</span>':'')+'</div><i class="bar"></i>';
  $('#toasts').appendChild(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{ el.classList.add('hide'); setTimeout(()=>el.remove(),380); }, 3400);
}

function log(who, act, target, to){ activity.unshift({who, act, target, to, at:0}); activity = activity.slice(0,14); }
function actText(a){
  const n = '<b>'+esc(M(a.who).name)+'</b>';
  const t = '<span class="tl-ref" data-open="'+esc(a.target)+'">'+esc(a.target)+'</span>';
  return a.to ? n+' '+esc(a.act)+' '+t+' 到「'+STATUS[a.to].name+'」' : n+' '+esc(a.act)+' '+t;
}

function spark(vals, color, w, h){
  w=w||92; h=h||30;
  const max = Math.max.apply(null,vals), min = Math.min.apply(null,vals);
  const pts = vals.map((v,i)=>[(w-4)*i/(vals.length-1)+2, h-3-(h-8)*((v-min)/((max-min)||1))]);
  const d = 'M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L');
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" fill="none"><path d="'+d+'" stroke="'+color+'" stroke-width="1.8" stroke-linecap="round" opacity=".85"/></svg>';
}
function lineChart(vals, w, h){
  w=w||620; h=h||170;
  const pad={l:10,r:10,t:16,b:6}, max=Math.max.apply(null,vals)*1.2;
  const iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const pts=vals.map((v,i)=>[pad.l+iw*i/(vals.length-1), pad.t+ih-(v/max)*ih]);
  let d='M'+pts[0][0]+','+pts[0][1].toFixed(1);
  for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],mx=(a[0]+b[0])/2; d+=' C'+mx+','+a[1].toFixed(1)+' '+mx+','+b[1].toFixed(1)+' '+b[0]+','+b[1].toFixed(1);}
  const area = d+' L'+pts[pts.length-1][0]+','+(h-pad.b)+' L'+pts[0][0]+','+(h-pad.b)+' Z';
  let grid='';
  [0.25,0.5,0.75].forEach(f=>{ grid+='<line x1="'+pad.l+'" x2="'+(w-pad.r)+'" y1="'+(pad.t+ih*f).toFixed(1)+'" y2="'+(pad.t+ih*f).toFixed(1)+'" stroke="var(--line2)" stroke-width="1"/>'; });
  let dots='';
  pts.forEach((p,i)=>{ dots+='<circle cx="'+p[0]+'" cy="'+p[1].toFixed(1)+'" r="'+(i===pts.length-1?4:2.6)+'" fill="var(--accent)"'+(i===pts.length-1?' stroke="var(--panel)" stroke-width="2"':'')+'/>'; });
  const last=pts[pts.length-1];
  const tag='<g><rect x="'+(last[0]-42)+'" y="'+(last[1]-32)+'" width="48" height="22" rx="6" fill="var(--accent)"/><text x="'+(last[0]-18)+'" y="'+(last[1]-17)+'" text-anchor="middle" font-size="11.5" font-weight="600" fill="#fff" font-family="JetBrains Mono,monospace">'+vals[vals.length-1]+'</text></g>';
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto;display:block">'
    +'<defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".18"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>'
    +grid+'<path d="'+area+'" fill="url(#lg)"/><path d="'+d+'" stroke="var(--accent)" stroke-width="2.2" fill="none" stroke-linecap="round"/>'+dots+tag+'</svg>';
}
function donut(p, color, size, stroke){
  const r=(size-stroke)/2, c=2*Math.PI*r;
  return '<svg viewBox="0 0 '+size+' '+size+'">'
    +'<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" class="donut-track" stroke-width="'+stroke+'"/>'
    +'<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+stroke+'" stroke-linecap="round" class="donut-val" data-c="'+(c*p/100).toFixed(1)+'" stroke-dasharray="0 '+c.toFixed(1)+'" transform="rotate(-90 '+size/2+' '+size/2+')"/></svg>';
}
function countUp(el){
  const target=+el.dataset.count, dur=650, t0=performance.now();
  function step(t){
    const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
    el.textContent=Math.round(target*e);
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ---------- 拖拽（跨列 + 列内排序） ---------- */
let dragEl=null;
function bindDnD(){
  $$('.task').forEach(card=>{
    card.addEventListener('dragstart',e=>{
      dragEl=card; card.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
      try{e.dataTransfer.setData('text/plain',card.dataset.id)}catch(err){}
    });
    card.addEventListener('dragend',()=>{
      card.classList.remove('dragging');
      $$('.col').forEach(c=>c.classList.remove('drop-target'));
      dragEl=null;
    });
  });
  $$('.col').forEach(col=>{
    const body=col.querySelector('.col-body');
    col.addEventListener('dragover',e=>{
      e.preventDefault(); e.dataTransfer.dropEffect='move';
      col.classList.add('drop-target');
      if(!dragEl) return;
      const after=getAfter(body,e.clientY);
      if(after==null) body.appendChild(dragEl);
      else if(after!==dragEl) body.insertBefore(dragEl,after);
    });
    col.addEventListener('dragleave',e=>{ if(!col.contains(e.relatedTarget)) col.classList.remove('drop-target'); });
    col.addEventListener('drop',e=>{
      e.preventDefault(); col.classList.remove('drop-target');
      if(dragEl) commitDrag(dragEl,col);
    });
  });
}
function getAfter(container,y){
  const els=[...container.querySelectorAll('.task:not(.dragging)')];
  let closest=null, off=-Infinity;
  for(const el of els){
    const box=el.getBoundingClientRect(), o=y-box.top-box.height/2;
    if(o<0 && o>off){ off=o; closest=el; }
  }
  return closest;
}
function commitDrag(card,col){
  const to=col.dataset.col;
  const t=tasks.find(x=>x.id===card.dataset.id);
  if(!t) return;
  const body=col.querySelector('.col-body');
  const order=[...body.querySelectorAll('.task')].map(el=>el.dataset.id);
  const moved=t.status!==to;
  tasks=tasks.slice().sort((a,b)=>{
    const ia=order.indexOf(a.id), ib=order.indexOf(b.id);
    if(ia>=0&&ib>=0) return ia-ib;
    if(ia>=0) return -1;
    if(ib>=0) return 1;
    return 0;
  });
  if(moved){
    const from=t.status; t.status=to;
    log(t.who,'将',t.title,to);
    toast('状态已更新','「'+esc(t.title)+'」'+STATUS[from].name+' → '+STATUS[to].name,'ok');
  }
  render();
  if(state.page==='board'){
    const el=document.querySelector('.task[data-id="'+t.id+'"]');
    if(el){ el.style.boxShadow='0 0 0 3px var(--ring)'; setTimeout(()=>el.style.boxShadow='',800); }
  }
}

    {grp:'quick', label:'新建任务', sub:'⌘N', icon:'<path d="M12 5v14M5 12h14"/>', run:()=>openTaskModal('todo')},
    {grp:'quick', label:'切换深浅色主题', sub:'', icon:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>', run:()=>$('#themeToggle').click()},
    {grp:'page', label:'仪表盘', sub:'⌘1', icon:'<rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.6"/>', run:()=>go('dashboard')},
    {grp:'page', label:'任务看板', sub:'⌘2', icon:'<rect x="3" y="4" width="5" height="16" rx="1.6"/><rect x="10" y="4" width="5" height="11" rx="1.6"/><rect x="17" y="4" width="4" height="14" rx="1.6"/>', run:()=>go('board')},
    {grp:'page', label:'团队', sub:'⌘3', icon:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>', run:()=>go('team')},
    {grp:'page', label:'项目设置', sub:'⌘4', icon:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3"/>', run:()=>go('settings')}
  ];
}
function openPalette(){ $('#palOvl').classList.add('show'); $('#palInput').value=''; palRender(''); setTimeout(()=>$('#palInput').focus(),80); }
function closePalette(){ $('#palOvl').classList.remove('show'); }
$('#openPalette').onclick=openPalette; $('#navPalette').onclick=openPalette;
$('#palOvl').addEventListener('mousedown',e=>{ if(e.target===e.currentTarget) closePalette(); });
$('#palInput').addEventListener('input',e=>palRender(e.target.value));
function palRender(q){
  const kq=q.trim().toLowerCase();
  const acts=palActions().filter(a=>!kq||a.label.toLowerCase().indexOf(kq)>=0);
  const ts=tasks.filter(t=>kq&&(t.title+' '+t.id).toLowerCase().indexOf(kq)>=0);
  palItems=acts.map(a=>({type:'act',a})).concat(ts.map(t=>({type:'task',t})));
  palSel=0;
  let html='';
  if(acts.length) html+='<div class="pal-group">快速操作与页面</div>'+acts.map((a,i)=>palItemHTML('act',a,i)).join('');
  if(ts.length) html+='<div class="pal-group">任务</div>'+ts.map((t,j)=>palItemHTML('task',t,acts.length+j)).join('');
  $('#palList').innerHTML=html||'<div class="pal-empty">没有匹配的结果，换个关键词试试</div>';
  $$('.pal-item').forEach(el=>{
    el.onclick=()=>palRun(+el.dataset.i);
    el.onmousemove=()=>{palSel=+el.dataset.i;palPaint();};
  });
  palPaint();
}
function palItemHTML(type,obj,i){
  if(type==='act') return '<button class="pal-item" data-i="'+i+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+obj.icon+'</svg>'+esc(obj.label)+'<span class="sub">'+obj.sub+'</span></button>';
  return '<button class="pal-item" data-i="'+i+'"><img src="'+AV[obj.who]+'" alt="">'+esc(obj.title)+'<span class="sub">'+obj.id+' · '+STATUS[obj.status].name+'</span></button>';
}
function palPaint(){ $$('.pal-item').forEach(el=>el.classList.toggle('sel',+el.dataset.i===palSel)); }
function palRun(i){
  const it=palItems[i]; if(!it) return;
  closePalette();
  if(it.type==='act') it.a.run();
  else { go('board'); openDrawer(it.t.id); }
}
$('#palInput').addEventListener('keydown',e=>{
  const n=palItems.length;
  if(e.key==='ArrowDown'&&n){ e.preventDefault(); palSel=(palSel+1)%n; palPaint(); scrollPal(); }
  else if(e.key==='ArrowUp'&&n){ e.preventDefault(); palSel=(palSel-1+n)%n; palPaint(); scrollPal(); }
  else if(e.key==='Enter'){ e.preventDefault(); palRun(palSel); }
});
function scrollPal(){ const el=$('.pal-item.sel'); if(el) el.scrollIntoView({block:'nearest'}); }

/* ================================================================
   弹窗
   ================================================================ */
let newPrio='high';
function openTaskModal(status){
  $('#fStatus').value=status||'todo';
  $('#fTitle').value='';
  $('#fDue').value=new Date(Date.now()+7*86400000).toISOString().slice(0,10);
  newPrio='high';
  $$('#prioPick .prio-opt').forEach(b=>b.classList.toggle('on',b.dataset.prio==='high'));
  $('#taskOvl').classList.add('show');
  setTimeout(()=>$('#fTitle').focus(),100);
}
function closeModal(id){ $(id==='task'?'#taskOvl':'#cfOvl').classList.remove('show'); }
$$('[data-close]').forEach(b=>b.onclick=()=>closeModal(b.dataset.close));
$('#taskOvl').addEventListener('mousedown',e=>{ if(e.target===e.currentTarget) closeModal('task'); });
$('#cfOvl').addEventListener('mousedown',e=>{ if(e.target===e.currentTarget) closeModal('cf'); });
$$('#prioPick .prio-opt').forEach(b=>b.onclick=()=>{
  newPrio=b.dataset.prio;
  $$('#prioPick .prio-opt').forEach(x=>x.classList.toggle('on',x===b));
});
$('#taskForm').addEventListener('submit',e=>{
  e.preventDefault();
  const title=$('#fTitle').value.trim();
  if(!title){ toast('请填写任务标题','','warn'); return; }
  const t={id:'PH-'+(++seq), title:title, prio:newPrio, who:$('#fWho').value, due:$('#fDue').value, status:$('#fStatus').value, tags:[], sub:[{t:'明确验收标准',d:0},{t:'拆解并排期',d:0}], comments:[]};
  tasks.push(t);
  log(t.who,'创建了新任务',t.title);
  closeModal('task');
  toast('任务已创建','「'+esc(title)+'」· '+STATUS[t.status].name+' · 负责人 '+esc(M(t.who).name),'ok');
  if(state.page==='board'||state.page==='dashboard') render();
});
let confirmFn=null;
function openConfirm(title,desc,fn){
  $('#cfTitle').textContent=title; $('#cfDesc').textContent=desc; confirmFn=fn;
  $('#cfOvl').classList.add('show');
}
$('#cfOk').onclick=()=>{ closeModal('cf'); if(confirmFn){confirmFn();confirmFn=null;} };

/* ================================================================
   通知
   ================================================================ */
function renderNotifs(){
  $('#notifList').innerHTML=notifs.map(n=>
    '<div class="np-item'+(n.unread?' unread':'')+'"><img src="'+AV[n.who]+'" alt=""><div><div class="np-text">'+n.text+'</div><div class="np-time">'+ago(n.at)+'</div></div></div>').join('');
  const un=notifs.filter(n=>n.unread).length;
  $('#notifDot').style.display=un?'block':'none';
}
$('#notifBtn').onclick=e=>{
  e.stopPropagation();
  $('#notifPanel').classList.toggle('show');
};
$('#readAll').onclick=()=>{ notifs.forEach(n=>n.unread=0); renderNotifs(); toast('通知已全部读完','','info'); };
document.addEventListener('click',e=>{
  if(!e.target.closest('.notif-panel') && !e.target.closest('#notifBtn')) $('#notifPanel').classList.remove('show');
});
$('#userBtn').onclick=()=>toast('当前身份','傅硕一 · 项目管理员 · projecthub.dev/@fushuoyi','info');
$('#projSwitch').onclick=()=>toast('项目切换','当前仅「项目中心」一个项目，更多空间即将开放','info');
$('#newBtn').onclick=()=>openTaskModal('todo');
$('#navNew').onclick=()=>openTaskModal('todo');

/* ================================================================
   快捷键
   ================================================================ */
document.addEventListener('keydown',e=>{
  const mod=e.metaKey||e.ctrlKey;
  if(mod&&e.key.toLowerCase()==='k'){ e.preventDefault(); if($('#palOvl').classList.contains('show')) closePalette(); else openPalette(); return; }
  if(mod&&e.key.toLowerCase()==='n'){ e.preventDefault(); openTaskModal('todo'); return; }
  if(mod&&['1','2','3','4'].indexOf(e.key)>=0){
    e.preventDefault();
    const p=['dashboard','board','team','settings'][+e.key-1];
    go(p); toast('已切换到「'+PAGES[p].t+'」','','info'); return;
  }
  if(e.key==='Escape'){
    if($('#palOvl').classList.contains('show')){ closePalette(); return; }
    if($('#cfOvl').classList.contains('show')){ closeModal('cf'); return; }
    if($('#taskOvl').classList.contains('show')){ closeModal('task'); return; }
    if($('#drawer').classList.contains('show')){ closeDrawer(); return; }
    if($('#notifPanel').classList.contains('show')) $('#notifPanel').classList.remove('show');
  }
});

/* ================================================================
   启动
   ================================================================ */
(function init(){
  $('#fWho').innerHTML=MEMBERS.map(m=>'<option value="'+m.id+'">'+esc(m.name)+' · '+esc(m.role)+'</option>').join('');
  const d=new Date();
  $('#todayText').textContent=d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate();
  let saved=null; try{ saved=localStorage.getItem('ph-theme'); }catch(err){}
  setTheme(saved||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
  renderNotifs();
  render();
})();
</script>
